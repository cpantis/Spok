      ${state.pron[i]?`<div class="kwin">${starSVG(true)}<div><b>Ai câștigat: <span lang="en">${esc(P.badge)}</span></b><p class="tip">Bravo! Poți exersa din nou oricând.</p></div></div>`
        :`<p class="prompt">Ai spus toate cuvintele?</p>`}
      <div class="row"><button class="btn ${state.pron[i]?"ghost":"kbtn"}" id="pstar">${state.pron[i]?"Retrage steluța":"Am reușit! Vreau o steluță"}</button>
      ${i<PRON.length-1?`<button class="btn ghost" id="pnext">Sunetul următor →</button>`:""}</div>
    </div>
  </section>`;
  window.scrollTo(0,0);
  const btns=[...app.querySelectorAll(".pword")], sent=$("#psent");
  const clearActive=()=>{btns.forEach(b=>b.classList.remove("active"));sent.classList.remove("active");};
  const ttsSay=(text,done)=>{try{if(!("speechSynthesis" in window)){done&&done();return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";const v=englishVoices()[0];if(v)u.voice=v;u.rate=.8;u.onend=u.onerror=()=>done&&done();speechSynthesis.speak(u);}catch(e){done&&done();}};
  const say=(name,text,el,container,after)=>{stopClip();try{speechSynthesis.cancel();}catch(e){}clearActive();el.classList.add("active");markPractice();
    const done=()=>{el.classList.remove("active");after&&after();};
    if(!naturalFailed) playClip(name,container||null,1,null,done,()=>ttsSay(text,done)); else ttsSay(text,done);};
  const items=btns.map(b=>({name:`„${b.dataset.t}”`,show:`Ales: „${b.dataset.t}”`,play:d=>say(b.dataset.a,b.dataset.t,b,null,d),clip:()=>naturalFailed?null:b.dataset.a}))
    .concat([{name:"propoziția",show:`Ales: „${P.sentence}”`,play:d=>say(`p${n}-s`,P.sentence,sent,sent,d),clip:()=>naturalFailed?null:`p${n}-s`}]);
  const cmp=bindCompare(CMP_RO,items,()=>{stopClip();try{speechSynthesis.cancel();}catch(e){}clearActive();},items.length-1);
  btns.forEach((b,j)=>b.onclick=()=>{cmp.select(j);say(b.dataset.a,b.dataset.t,b);});
  sent.onclick=()=>{cmp.select(items.length-1);say(`p${n}-s`,P.sentence,sent,sent);};
  cleanup.push(()=>{stopClip();try{speechSynthesis.cancel();}catch(e){}});
  $("#pstar").onclick=()=>{state.pron[i]=!state.pron[i];if(state.pron[i])markPractice();save();rerender(()=>pronLesson(i));};
  if($("#pnext")) $("#pnext").onclick=()=>go("sound-"+(i+2));
}

/* ---- ABOUT ---- */
function about(){
  topbar(false); setTab("about");
  const A=AUTHOR;
  app.innerHTML=`<section class="view">
    <div class="author">
      <div class="avatar" aria-hidden="true">${esc(A.name.split(" ").map(x=>x[0]).join(""))}</div>
      <div style="min-width:0;display:flex;flex-direction:column;gap:4px">
        <p class="eyebrow">Made by</p><h1 class="aname">${esc(A.name)}</h1><p class="muted">${esc(A.role)}</p>
      </div>
    </div>
    <p class="goal">${esc(A.bio)}</p>
    <div class="open">
      <div class="row"><span class="pill"><span class="pdot"></span>Open to work</span><span class="pill">Open to collaborations</span></div>
      <p>${esc(A.pitch)}</p>
      <div class="contact">
        ${A.email?`<span class="mail" id="mail">${esc(A.email)}</span><button class="btn ghost small" id="cmail">Copy email</button>`:""}
        ${A.linkedin?`<a class="btn ghost small" href="${esc(A.linkedin)}" target="_blank" rel="noopener">LinkedIn ↗</a>`:""}
      </div>
    </div>
    <div class="card"><h2 class="eyebrow">Your progress</h2>
      <p>${esc(progressSummary())}</p>
      <p class="tip">Progress is stored only in this browser. Browsers can clear it, for example Safari after a few weeks without visits, so keep a backup file before switching phones or clearing data.</p>
      <div class="row"><button class="btn dark small" id="bsave">Save backup file</button>
        <button class="btn ghost small" id="bpick">Restore from file</button><input type="file" id="bload" accept=".json,application/json" hidden aria-hidden="true" tabindex="-1"></div>
      <p class="tip" id="bstat" role="status"></p>
    </div>
    <div class="card"><h2 class="eyebrow">Send feedback</h2>
      <p class="tip">Found a bug, have an idea, or want a new lesson? I read every message.</p>
      <div class="fgrid">
        <label for="ftype" class="tip">Topic</label>
        <select id="ftype" class="vsel"><option>Idea or suggestion</option><option>Something isn't working</option><option>New lesson request</option><option>Collaboration or job offer</option><option>Other</option></select>
        <label for="fname" class="tip">Your name (optional)</label>
        <input id="fname" class="vsel" autocomplete="name">
        <label for="fmsg" class="tip">Message</label>
        <textarea id="fmsg" placeholder="What would make TrySpok better for you?"></textarea>
      </div>
      <div class="row"><button class="btn dark" id="fsend">Send by email</button><button class="btn ghost small" id="fcopy">Copy message</button></div>
      <p class="tip" id="fstat" aria-live="polite"></p>
    </div>
    <div class="card support"><h2 class="eyebrow">Support TrySpok</h2>
      <p>TrySpok is free, with no ads and no account. If it helped you before an interview or a big meeting, you can support my personal projects.</p>
      ${A.donate?`<div class="row"><a class="btn primary" href="${esc(A.donate)}" target="_blank" rel="noopener">${esc(A.donateLabel)} ↗</a></div>`
        :`<p class="tip">A donation link is coming soon. Until then, sharing TrySpok with a friend helps a lot.</p>`}
    </div>
    <p class="tip">TrySpok ${APP_VERSION} · Works offline once installed · Progress stays on your device · Voice generated with Kokoro (Apache 2.0)</p>
  </section>`;
  const bstat=t=>$("#bstat").textContent=t;
  $("#bsave").onclick=()=>{try{
    const data=JSON.stringify({app:"spok",version:1,saved:new Date().toISOString(),state},null,1);
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));
    a.download=`spok-progress-${today()}.json`;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),10000);bstat("Backup saved to your downloads.");
  }catch(e){bstat("The backup couldn't be saved in this browser.");}};
  $("#bpick").onclick=()=>$("#bload").click();
  $("#bload").onchange=async e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;
    try{const d=JSON.parse(await f.text()), st=d&&d.app==="spok"&&d.state;
      if(!st||typeof st!=="object"||!Array.isArray(st.days)) throw new Error("not a TrySpok backup");
      if(!confirm("Replace the progress on this device with the backup?")) return;
      state=normalizeState(st);save();about();bstat("Progress restored.");
    }catch(err){bstat("That file isn't a TrySpok backup. Choose the .json file saved from TrySpok.");}};
  const msg=()=>{const t=$("#ftype").value,n=$("#fname").value.trim(),m=$("#fmsg").value.trim();return {t,n,m,body:`Topic: ${t}\n${n?"From: "+n+"\n":""}\n${m}\n\n— sent from TrySpok ${APP_VERSION}`};};
  const stat=t=>$("#fstat").textContent=t;
  const copy=async(text,ok)=>{try{await navigator.clipboard.writeText(text);stat(ok);}catch(e){stat("Copy didn't work here. Select the text and copy it manually.");}};
  if($("#cmail")) $("#cmail").onclick=()=>copy(A.email,"Email address copied.");
  $("#fsend").onclick=()=>{const x=msg(); if(!x.m){stat("Write a message first.");$("#fmsg").focus();return;}
    if(!A.email){copy(x.body,"Message copied.");return;}
    location.href=`mailto:${A.email}?subject=${encodeURIComponent("TrySpok feedback: "+x.t)}&body=${encodeURIComponent(x.body)}`;
    stat(`Your email app should open with the message ready. If it doesn't, tap "Copy message" and send it to ${A.email}.`);};
  $("#fcopy").onclick=()=>{const x=msg(); if(!x.m){stat("Write a message first.");return;} copy(x.body,`Message copied. Paste it into an email to ${A.email}.`);};
}

/* ---- router ---- */
function go(name){ if(location.hash!=="#"+name) location.hash=name; else route(); }
function route(){
  stopAll();
  const h=location.hash.slice(1);
  const m=h.match(/^lesson-(\d+)$/);
  if(m&&+m[1]>=1&&+m[1]<=LESSONS.length) lesson(+m[1]-1);
  else if(h==="warmup") warmup(false);
  else if(h==="warmup-express") warmup(true);
  else if(/^kids-\d+$/.test(h)&&+h.slice(5)>=1&&+h.slice(5)<=KIDS.length) kidLesson(+h.slice(5)-1);
  else if(/^sound-\d+$/.test(h)&&+h.slice(6)>=1&&+h.slice(6)<=PRON.length) pronLesson(+h.slice(6)-1);
  else if(h==="kids") kids();
  else if(h==="prep") prepPlan();
  else if(/^prep-\d+$/.test(h)&&+h.slice(5)>=1&&+h.slice(5)<=PREP.length){const k=+h.slice(5)-1;PREP[k].warm?warmup(true,k):lesson(PREP[k].l,k);}
  else if(h==="about") about();
  else home();
  window.scrollTo(0,0);
  // name the page and move screen-reader focus to its heading (not on first load)
  const h1=app.querySelector("h1"), name=h1?h1.textContent.replace(/\s+/g," ").trim():"";
  document.title=h==="home"||!h||!name?"TrySpok: speak clearly, interview with confidence":name+" · TrySpok";
  if(routed&&h1){h1.tabIndex=-1;h1.focus({preventScroll:true});}
  app.dataset.route=h||"home"; // which page is on screen (used by the tests)
  routed=true;
}
let routed=false;
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>go(b.dataset.tab));
window.addEventListener("hashchange",route);
route();

if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js").catch(()=>{});}catch(e){}}
</script>
