<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spok</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1B2230">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Baloo+2:wght@600;700&display=swap">
<style>
/* Layout: single-column phone app — sticky top bar, stacked lesson rows, bottom tab bar. */
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --ink:#18202C; --muted:#5D6778; --line:#DCE1E8;
  --accent:#E2552A; --accent-ink:#FFFFFF; --accent-soft:#FCE7DF; --good:#1F8A5B; --good-soft:#DDF2E8;
  --bar:#1B2230; --bar-ink:#F3F5F8; --hl:#FFE3A3;
  --m-voice:#E2552A; --m-interview:#2F6FD6; --m-meetings:#1F8F6A; --m-hard:#7A4FD0;
  --k-sky:#2F86D6; --k-sun:#E8A317; --k-grape:#8A5CD1; --k-leaf:#2E9E5B; --k-berry:#D9466F;
  --kid:"Baloo 2", "Bricolage Grotesque", system-ui, sans-serif;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161F; --surface:#1A212D; --ink:#E8ECF2; --muted:#98A2B3; --line:#2A3342;
  --accent:#F2683C; --accent-ink:#1A0D07; --accent-soft:#3A2219; --good:#4CC28B; --good-soft:#173329;
  --bar:#0B0F15; --bar-ink:#E8ECF2; --hl:#5A4415; --m-voice:#F2683C; --m-interview:#6A9BF0; --m-meetings:#3FBF8F; --m-hard:#A787F0; --k-sky:#3E8FDB; --k-sun:#E3A21F; --k-grape:#9468D8; --k-leaf:#2F9A5A; --k-berry:#D9507A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11161F; --surface:#1A212D; --ink:#E8ECF2; --muted:#98A2B3; --line:#2A3342;
  --accent:#F2683C; --accent-ink:#1A0D07; --accent-soft:#3A2219; --good:#4CC28B; --good-soft:#173329;
  --bar:#0B0F15; --bar-ink:#E8ECF2; --hl:#5A4415; --m-voice:#F2683C; --m-interview:#6A9BF0; --m-meetings:#3FBF8F; --m-hard:#A787F0; --k-sky:#3E8FDB; --k-sun:#E3A21F; --k-grape:#9468D8; --k-leaf:#2F9A5A; --k-berry:#D9507A; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-ink)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.logo{display:flex;align-items:flex-end;gap:3px;height:22px}
.logo i{display:block;width:4px;border-radius:2px;background:var(--accent)}
.brand{font:700 20px/1 var(--display);letter-spacing:-.01em}
.top .back{background:none;border:0;color:var(--bar-ink);padding:6px 4px;font-weight:600;display:flex;gap:6px;align-items:center}
.top .spacer{flex:1}
.streak{font:500 12px var(--mono);opacity:.85}

main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
section.view{padding-block:20px;display:flex;flex-direction:column;gap:22px}

h1{font:800 clamp(28px,7vw,40px)/1.05 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font:700 20px/1.2 var(--display);margin:0;text-wrap:balance}
h3{font:600 12px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
p{margin:0}
.muted{color:var(--muted)}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.ring{width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:700 22px/1 var(--display)}
.ring .num small{display:block;font:500 10px var(--mono);color:var(--muted);margin-top:4px}

.next{background:var(--bar);color:var(--bar-ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.next h3{color:#A9B3C3}
.next .t{font:700 22px/1.15 var(--display)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.small{padding:8px 12px;min-height:36px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* lesson list */
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item .n{font:500 13px var(--mono);color:var(--muted)}
.item .ti{font-weight:600;min-width:0}
.item .mi{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.item.done .n{color:var(--good)}
.item.done .ti{color:var(--muted)}
.chk{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--good);color:var(--surface);font-size:12px}

/* lesson view */
.meta{display:flex;gap:12px;font:500 12px var(--mono);color:var(--muted);flex-wrap:wrap}
.goal{font-size:17px;line-height:1.5;max-width:60ch}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.ideas{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.ideas li{display:grid;grid-template-columns:22px 1fr;gap:10px}
.ideas li b{font:700 15px var(--display);color:var(--accent)}
.lines{display:flex;flex-direction:column;gap:10px}
.line{font:600 18px/1.4 var(--display);padding:12px 14px;border-radius:12px;background:var(--bg);border:0;text-align:left;width:100%}
.line.active{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.line .w.on{background:var(--hl);border-radius:4px}
.cue{display:inline-flex;align-items:center;gap:5px;vertical-align:.12em;font:italic 500 13px/1 var(--body);letter-spacing:.02em;color:var(--accent);background:var(--surface);border:1.5px dashed color-mix(in srgb,var(--accent) 55%,transparent);border-radius:999px;padding:4px 10px 4px 9px;white-space:nowrap}
.cue svg{width:11px;height:11px;fill:currentColor}
.cue .w.on{background:none;text-decoration:underline;text-underline-offset:3px}
.cue:has(.w.on){background:var(--accent);color:var(--accent-ink);border-style:solid;border-color:var(--accent)}
.tip{font-size:13px;color:var(--muted)}
.speed{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.speed input{flex:1;min-width:140px;accent-color:var(--accent)}
.speed output{font:500 13px var(--mono);min-width:64px}
.vsel{flex:1;min-width:0;max-width:100%;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:14px var(--body)}

.timer{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.clock{font:700 44px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.clock.over{color:var(--accent)}
.tally{display:flex;align-items:center;gap:10px}
.tally .count{font:700 22px var(--mono);min-width:2ch;text-align:center}
.prompt{font:600 18px/1.4 var(--display)}
.rec{display:flex;flex-direction:column;gap:10px}
.rec audio{width:100%}
.note{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}
.checks input{width:20px;height:20px;accent-color:var(--good);margin-top:2px;flex:none}
.complete{background:var(--good-soft);color:var(--good);border-radius:12px;padding:12px 14px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block}
.dot.live{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

/* tabbar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
textarea.mono{font:13px/1.4 var(--mono);min-height:90px;word-break:break-all}
textarea{width:100%;min-height:120px;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);color:var(--ink);font:16px/1.5 var(--body);resize:vertical}
/* hero */
.herotext{display:flex;flex-direction:column;gap:12px;min-width:0}
.hero h1 .hl{color:var(--m-interview)}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stats span{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.stats b{color:var(--ink);font-weight:700}
.ring .num small{letter-spacing:.06em}
.next .mdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mc);margin-right:8px;vertical-align:1px}

/* quick warm-up */
.quick{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.qicon{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--m-voice) 14%,var(--surface));color:var(--m-voice)}
.qicon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.qtext{display:flex;flex-direction:column;gap:2px;min-width:0}
.qtext b{font:700 16px var(--display)}.qtext span{font-size:13px;color:var(--muted)}
.qbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:480px){.quick{grid-template-columns:44px 1fr}.qbtns{grid-column:1/-1;justify-content:stretch}.qbtns .btn{flex:1}}
.seg{display:inline-flex;align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
/* modules: collapsible cards, each in its own colour */
.modules{display:flex;flex-direction:column;gap:12px}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.mod.expanded{border-color:color-mix(in srgb,var(--mc) 45%,var(--line))}
.mtop{display:grid;grid-template-columns:44px 1fr 22px;gap:14px;align-items:start;width:100%;text-align:left;background:none;border:0;padding:16px}
.micon{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--mc) 15%,var(--surface));color:var(--mc)}
.micon svg,.mchip svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mtext{display:flex;flex-direction:column;gap:6px;min-width:0}
.mname{font:700 19px/1.2 var(--display)}
.mblurb{font-size:13px;color:var(--muted)}
.mbar{display:block;height:6px;border-radius:3px;background:color-mix(in srgb,var(--mc) 15%,var(--line));overflow:hidden;margin-top:4px}
.mbar i{display:block;height:100%;background:var(--mc);border-radius:3px;min-width:0}
.mmeta{font:500 12px var(--mono);color:var(--muted)}
.chev{width:22px;height:22px;margin-top:12px;fill:none;stroke:var(--muted);stroke-width:2;transition:transform .2s}
.mod.expanded .chev{transform:rotate(180deg)}
.mlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.lrow{grid-template-columns:30px 1fr auto;padding:12px 16px;gap:12px}
.lrow:last-child{border-bottom:0}
.lnum{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;font:600 13px var(--body);color:var(--mc);border:1.5px solid color-mix(in srgb,var(--mc) 40%,transparent)}
.lnum svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.lrow.done .lnum{background:var(--mc);color:var(--surface);border-color:var(--mc)}
.lrow.isnext{background:color-mix(in srgb,var(--mc) 9%,var(--surface))}
.lrow.isnext .lnum{background:var(--mc);color:var(--surface);border-color:var(--mc)}
.lrow .ti{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nextpill{font:700 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mc);border:1.5px solid var(--mc);border-radius:999px;padding:3px 7px}

/* lesson pages take their module colour */
.modtint{--accent:var(--mc);--accent-soft:color-mix(in srgb,var(--mc) 15%,var(--surface))}
.lhead{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:20px;background:color-mix(in srgb,var(--mc) 11%,var(--bg));border:1px solid color-mix(in srgb,var(--mc) 25%,transparent)}
.mchip{display:inline-flex;align-items:center;gap:6px;color:var(--mc);font-weight:600;text-transform:uppercase}
.mchip svg{width:15px;height:15px}
.modtint .card h3{color:var(--mc)}

/* kids */
.kidsv h1{font-family:var(--kid)}
.kidhero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.kidlead{font-size:18px;line-height:1.5;max-width:52ch}
.starbox{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.starbox b{font:700 26px/1 var(--kid)}.starbox small{font-size:14px;color:var(--muted)}
.star{width:26px;height:26px;fill:var(--line)}.star.on{fill:var(--k-sun)}
.kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kcard{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;border:0;border-radius:20px;padding:16px;min-height:132px;background:color-mix(in srgb,var(--kc) 22%,var(--surface));color:var(--ink)}
.kcard .knum{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--kc) 85%,#000);color:#fff;font:700 17px var(--kid)}
.kcard .kt{font:700 18px/1.2 var(--kid);min-width:0}
.kcard .kbadge{margin-top:auto;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.kcard .kbadge .star{width:16px;height:16px}
.kidtop{display:flex;flex-direction:column;gap:12px;background:color-mix(in srgb,var(--kc) 20%,var(--surface));border-radius:22px;padding:20px}
.kcardx{border-radius:20px}
.kcardx h3{color:var(--kc)}
.kgame{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:17px}
.kgame li::marker{font:700 17px var(--kid);color:var(--kc)}
.kline{font-family:var(--kid);font-size:20px}
.kline .spk{font-size:15px;margin-right:4px}
.kline.active{background:color-mix(in srgb,var(--kc) 22%,var(--surface));box-shadow:inset 3px 0 0 var(--kc)}
.btn.kbtn{background:color-mix(in srgb,var(--kc) 78%,#000);color:#fff}
.kwin{display:flex;gap:12px;align-items:center}.kwin .star{width:44px;height:44px;flex:none}
.kwin b{font:700 20px var(--kid)}

/* about */
.author{display:flex;gap:16px;align-items:center}
.avatar{flex:none;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:var(--bar);color:var(--accent);font:800 28px var(--display);letter-spacing:-.02em}
.aname{font-size:clamp(26px,6vw,34px)}
.open{display:flex;flex-direction:column;gap:12px;align-items:flex-start;background:var(--good-soft);border-radius:16px;padding:16px}
.open p{max-width:60ch}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--good);border:1.5px solid var(--good);border-radius:999px;padding:4px 10px;}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.contact{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mail{font:500 14px var(--mono);user-select:all;word-break:break-all}
a.btn{text-decoration:none;color:inherit}
a.btn.primary{color:var(--accent-ink)}
.fgrid{display:flex;flex-direction:column;gap:6px}
.fgrid input{font-size:16px}
.fgrid label{margin-top:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>

<header class="top"><div class="wrap" id="topbar"></div></header>
<main><div class="wrap" id="app"></div></main>
<nav class="tabs" aria-label="Sections"><div class="wrap">

  <button data-tab="warmup"><svg viewBox="0 0 24 24"><path d="M3 12h3l3-7 4 14 3-7h5"/></svg>Warm-up</button>

<script>
const MODULES = [
 {id:"voice", name:"Voice foundations", blurb:"Breath, consonants, pace and tone. The base for everything else."},
 {id:"interview", name:"Interview ready", blurb:"From \"tell me about yourself\" to the final handshake."},
 {id:"meetings", name:"Speaking in meetings", blurb:"Get your turn, make your point, keep the room with you."},
 {id:"hard", name:"Hard conversations", blurb:"Feedback, refusals and pushback, handled calmly."}
];

const LESSONS = [
 /* ---------- Voice foundations ---------- */
 {mod:"voice",t:"Breath Before Words",m:10,goal:"Start every answer from a calm, low breath so your voice comes out steady instead of tight.",
  ideas:["Breathe in through the nose so your belly moves, not your shoulders.","Let the first word ride on the out-breath. Starting on empty lungs makes the voice thin.","One breath per sentence is a good rhythm for interviews."],
  drill:["[Breathe in.] (pause) Thank you for having me today.","[Breathe in.] (pause) Let me walk you through it.","[Breathe in.] (pause) That's a great question."],
  dtip:"Take a real breath at each pause. Notice how the first word comes out fuller.",
  prompt:"Say why you applied for your last job, one breath per sentence.",secs:30,
  checks:["My shoulders stayed down","Each sentence started on fresh breath","My voice sounded steady, not tight"]},
 {mod:"voice",t:"Crisp Consonants",m:12,goal:"Finish your words. Clear consonants make you easier to follow, especially on calls and with accents.",
  ideas:["Final consonants carry meaning: wanT, planneD, asK.","Use the tip of the tongue for T, D and N, just behind the top teeth.","Lazy endings sound unsure. Crisp endings sound prepared."],
  drill:["Planned, checked, fixed and finished.","Big black bug bit a big black bear.","Red leather, yellow leather, red leather, yellow leather."],
  dtip:"Over-pronounce the last sound of every word. In real conversation, it settles to just the right amount.",
  prompt:"Describe a problem you solved, step by step.",secs:45,
  checks:["I could hear every word ending","T and D sounds were sharp","I didn't rush the last word"]},
 {mod:"voice",t:"Open Vowels Carry Further",m:10,goal:"Open your mouth wider so your voice reaches the whole room without strain.",

/* ---- storage ---- */
const KEY="spok-v2";
let state={done:{},checks:{},fillers:{},days:[],kids:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s) state=Object.assign(state,s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function markPractice(){const t=today(); if(!state.days.includes(t)){state.days.push(t); save();}}
function streak(){let n=0;const d=new Date();const set=new Set(state.days);
  if(!set.has(today())) d.setDate(d.getDate()-1);
  while(true){const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); if(set.has(k)){n++;d.setDate(d.getDate()-1);}else break;}
  return n;}

/* ---- progress backup (no account needed) ---- */
function progressSummary(){const a=LESSONS.filter((_,i)=>state.done[i]).length,k=KIDS.filter((_,i)=>state.kids[i]).length,d=state.days.length;
  return `Saved here: ${a} of ${LESSONS.length} lessons, ${k} of ${KIDS.length} kids' stars, ${d} practice day${d===1?"":"s"}.`;}

const fmt=s=>{const m=Math.floor(Math.abs(s)/60),x=Math.abs(s)%60;return (s<0?"+":"")+m+":"+String(x).padStart(2,"0")};
// Renders a line word by word. "(pause)" and [bracketed instructions] become cue chips, so they read as directions, not words to say.
const PAUSE_ICON='<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="2" width="2.4" height="8" rx="1"/><rect x="7.1" y="2" width="2.4" height="8" rx="1"/></svg>';
const words=s=>{let out="",inCue=false;
  s.split(/(\s+)/).forEach(p=>{
    if(!p) return;
    if(/^\s+$/.test(p)){out+=p;return;}
    if(p==="(pause)"){out+=`<span class="cue pause" title="Pause for two seconds">${PAUSE_ICON}<span class="w">pause</span></span>`;return;}
    let t=p,open=false,close=false;
    if(t.startsWith("[")){open=true;t=t.slice(1);}
    if(t.endsWith("]")){close=true;t=t.slice(0,-1);}
    if(open){out+='<span class="cue">';inCue=true;}
    out+=`<span class="w">${esc(t)}</span>`;
    if(close&&inCue){out+='</span>';inCue=false;}
  });
  if(inCue) out+='</span>';
  return out;};
let cleanup=[];
function stopAll(){cleanup.forEach(f=>{try{f()}catch(e){}});cleanup=[];}

function lesson(i){
  const L=LESSONS[i]; topbar(true); setTab("home");
  const ch=state.checks[i]||[];
  app.innerHTML=`<section class="view modtint" style="--mc:${modColor(L.mod)}">
    <div class="lhead">
      <div class="meta"><span class="mchip">${MOD_ICON[L.mod]}${esc(MODULES.find(m=>m.id===L.mod).name)}</span><span>LESSON ${i+1} OF ${LESSONS.length}</span><span>${L.m} MIN</span></div>
      <h1>${esc(L.t)}</h1>
      <p class="goal">${esc(L.goal)}</p>
    </div>
    <div class="card"><h3>1 · Key ideas</h3>
      <ul class="ideas">${L.ideas.map((x,k)=>`<li><b>${k+1}</b><span>${esc(x)}</span></li>`).join("")}</ul></div>
    <div class="card"><h3>2 · Articulation drill</h3>
      <p class="tip">${esc(L.dtip)} Tap a line to hear it, then repeat it out loud. Or play all lines and read along.</p>
      <div class="lines" id="lines">${L.drill.map((x,k)=>`<button class="line" data-k="${k}">${words(x)}</button>`).join("")}</div>
      <div class="speed"><label for="dwpm" class="tip">Guide speed</label><input type="range" id="dwpm" min="80" max="200" step="10" value="110"><output id="dwpmo">110 wpm</output></div>
      <div class="speed" id="vrow" hidden><label for="dvoice" class="tip">Teacher's voice</label><select id="dvoice" class="vsel"></select></div>
      <div class="row"><button class="btn ghost small" id="dplay">▶ Listen & read along</button></div>
    </div>
    <div class="card"><h3>3 · Speak it</h3>
      <p class="prompt">${esc(L.prompt)}</p>
      <div class="timer"><div class="clock" id="clock">${fmt(L.secs)}</div>
        <div class="row"><button class="btn primary small" id="tgo">Start ${L.secs}s timer</button><button class="btn ghost small" id="treset">Reset</button></div></div>
      ${L.tally?`<div class="tally"><span class="tip">Filler words</span><button class="btn ghost small" id="fminus" aria-label="Remove one">−</button><span class="count" id="fcount">0</span><button class="btn primary small" id="fplus">+ um / uh / like</button><span class="tip" id="fbest"></span></div>`:""}
      ${recorderHTML()}
    </div>
    <div class="card"><h3>4 · Check yourself</h3>
      <div class="checks">${L.checks.map((c,k)=>`<label><input type="checkbox" id="c${i}-${k}" data-k="${k}" ${ch[k]?"checked":""}><span>${esc(c)}</span></label>`).join("")}</div>
      <div class="row"><button class="btn ${state.done[i]?"ghost":"primary"}" id="done">${state.done[i]?"Completed · mark as not done":"Mark lesson complete"}</button>
      ${i<LESSONS.length-1?`<button class="btn ghost" id="nextL">Next lesson →</button>`:""}</div>
    </div>
  </section>`;
  window.scrollTo(0,0);

  // drill
  const lines=[...app.querySelectorAll(".line")]; let dTimer=null, playing=false;
  const dw=$("#dwpm"), dwo=$("#dwpmo");
  dw.oninput=()=>{dwo.textContent=dw.value+" wpm"; if(curClip) curClip.playbackRate=clipRate();};
  const TTS=("speechSynthesis" in window)&&("SpeechSynthesisUtterance" in window);
  const clearHL=()=>app.querySelectorAll(".line .w").forEach(w=>w.classList.remove("on"));
  const setActive=li=>lines.forEach((x,j)=>x.classList.toggle("active",j===li));
  const clipRate=()=>Math.min(1.6,Math.max(0.6,dw.value/110));
  function pickVoice(){const v=englishVoices(); return v.find(x=>x.name===state.voice)||v[0]||null;}
  const vsel=$("#dvoice");
  function fillVoices(){
    const v=TTS?englishVoices():[];
    vsel.innerHTML=`<option value="${NATURAL}">Heart · natural, warm (recommended)</option>`+
      (v.length?`<optgroup label="Voices on this device">${v.map(x=>`<option value="${esc(x.name)}">${esc(voiceLabel(x))}</option>`).join("")}</optgroup>`:"");
    vsel.value=useNatural()?NATURAL:(pickVoice()?.name||NATURAL); $("#vrow").hidden=false;}
  vsel.onchange=()=>{state.voice=vsel.value;naturalFailed=false;save();stopDrill();speakLine(0);};
  fillVoices();
  if(TTS){try{speechSynthesis.addEventListener("voiceschanged",fillVoices);cleanup.push(()=>speechSynthesis.removeEventListener("voiceschanged",fillVoices));}catch(e){}}
  function speakLine(li,onDone){
    if(useNatural()) return playClip(`l${i+1}-${li+1}`,lines[li],clipRate(),()=>{setActive(li)},onDone,()=>{if(TTS)speakTTS(li,onDone);else onDone&&onDone();});
    if(TTS) return speakTTS(li,onDone);
    onDone&&onDone();
  }
  function speakTTS(li,onDone){
    const text=L.drill[li], spans=[...lines[li].querySelectorAll(".w")], starts=[];
    text.replace(/\S+/g,(m,o)=>{starts.push(o);return m;});
    // same-length substitutions keep character positions aligned with the word highlights
    const u=new SpeechSynthesisUtterance(text.replace(/\(pause\)/g,"  ...  ").replace(/____/g,"name").replace(/[\[\]]/g," "));
    u.lang="en-US"; const v=pickVoice(); if(v) u.voice=v;
    u.rate=Math.min(1.4,Math.max(0.5,dw.value/150));
    u.onboundary=e=>{if(e.name&&e.name!=="word")return;let idx=0;starts.forEach((s,j)=>{if(s<=e.charIndex)idx=j;});spans.forEach((s,j)=>s.classList.toggle("on",j===idx));};
    let ended=false; u.onend=u.onerror=()=>{if(ended)return;ended=true;spans.forEach(s=>s.classList.remove("on"));onDone&&onDone();};
    setActive(li); try{speechSynthesis.resume();}catch(e){} speechSynthesis.speak(u);
  }
  function stopDrill(){playing=false;clearTimeout(dTimer);dTimer=null;stopClip();if(TTS){try{speechSynthesis.cancel();}catch(e){}}clearHL();$("#dplay").textContent="▶ Listen & read along";}
  lines.forEach((b,li)=>b.onclick=()=>{stopDrill();setActive(li);markPractice();speakLine(li);});
  $("#dplay").onclick=()=>{
    if(playing||dTimer){stopDrill();return;}
    markPractice(); $("#dplay").textContent="■ Stop";
    if(useNatural()||TTS){
      playing=true; if(TTS){try{speechSynthesis.cancel();}catch(e){}}
      let li=0;
      const next=()=>{if(!playing)return; if(li>=lines.length){stopDrill();setActive(-1);return;}
        speakLine(li++,()=>{if(playing) dTimer=setTimeout(next,800);});};
      next(); return;
    }
    const seq=[];lines.forEach((l,li)=>l.querySelectorAll(".w").forEach(w=>seq.push([li,w])));
    let k=0;
    const step=()=>{app.querySelectorAll(".line .w").forEach(w=>w.classList.remove("on"));
      if(k>=seq.length){stopDrill();lines.forEach(x=>x.classList.remove("active"));return;}
      const [li,w]=seq[k];lines.forEach((x,j)=>x.classList.toggle("active",j===li));w.classList.add("on");
      const pause=/[.,?!)]$/.test(w.textContent)?1.8:1; const gap=(k+1<seq.length&&seq[k+1][0]!==li)?2.2:1;
      k++; dTimer=setTimeout(step,60000/dw.value*Math.max(pause,gap));};
    step();
  };
  cleanup.push(stopDrill);

  // timer
  let left=L.secs, tInt=null; const clock=$("#clock");
  const draw=()=>{clock.textContent=fmt(left);clock.classList.toggle("over",left<0);};
  $("#tgo").onclick=()=>{
    if(tInt){clearInterval(tInt);tInt=null;$("#tgo").textContent="Resume";return;}
    markPractice(); $("#tgo").textContent="Pause";
    tInt=setInterval(()=>{left--;draw();if(left===0)beep();},1000);
  };
  $("#treset").onclick=()=>{clearInterval(tInt);tInt=null;left=L.secs;draw();$("#tgo").textContent=`Start ${L.secs}s timer`;};
  cleanup.push(()=>clearInterval(tInt));

  // filler tally
  if(L.tally){let f=0;const best=state.fillers[i];
    const show=()=>{$("#fcount").textContent=f;$("#fbest").textContent=best!=null?`Best: ${best}`:"";};
    $("#fplus").onclick=()=>{f++;show();}; $("#fminus").onclick=()=>{f=Math.max(0,f-1);show();};
    $("#treset").addEventListener("click",()=>{if(f>0||left!==L.secs){state.fillers[i]=best==null?f:Math.min(best,f);save();}f=0;show();});
    show();}

  bindRecorder();

  // checks & complete
  app.querySelectorAll(".checks input").forEach(c=>c.onchange=()=>{const a=state.checks[i]||[];a[+c.dataset.k]=c.checked;state.checks[i]=a;save();});
  $("#done").onclick=()=>{state.done[i]=!state.done[i]; if(state.done[i]) markPractice(); save(); lesson(i);};
  if($("#nextL")) $("#nextL").onclick=()=>go("lesson-"+(i+2));
}

function recorderHTML(){return `<div class="rec">
  <div class="row"><button class="btn ghost small" id="rec"><span class="dot"></span> Record yourself</button><span class="tip" id="rstat" aria-live="polite">Listen back to hear what others hear.</span></div>
  <div class="row" id="rplayrow" hidden><button class="btn primary small" id="rplay">▶ Play my recording</button></div>
  <audio id="play" controls playsinline hidden></audio>
  <p class="note" id="rnote" hidden></p></div>`;}
let mediaRec=null, stream=null, recUrl=null;
function recMime(){if(!window.MediaRecorder||!MediaRecorder.isTypeSupported)return "";
  for(const t of ["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"]) if(MediaRecorder.isTypeSupported(t)) return t; return "";}
function bindRecorder(){
  const btn=$("#rec"); if(!btn) return;
  const stat=$("#rstat"), audio=$("#play"), note=$("#rnote"), prow=$("#rplayrow");
  let tick=null, secs=0, stopTO=null;
  const MAX=180;
  const showErr=t=>{note.hidden=false;note.textContent=t;};
  $("#rplay").onclick=()=>{stopClip();try{speechSynthesis.cancel();}catch(e){}
    if(audio.paused){audio.currentTime=0;audio.play().catch(()=>showErr("Playback didn't start. Use the player controls below."));}else audio.pause();};
  audio.onplay=()=>$("#rplay").textContent="❚❚ Pause";
  audio.onpause=audio.onended=()=>$("#rplay").textContent="▶ Play my recording";
  btn.onclick=async()=>{
    if(mediaRec&&mediaRec.state==="recording"){mediaRec.stop();return;}
    note.hidden=true;
    if(!window.isSecureContext){showErr("Recording needs a secure (https) address. It works once the app is on its https website.");return;}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){showErr("This browser can't record audio. Try the latest Chrome or Safari, or use your phone's voice memo app alongside the timer.");return;}
    stopClip(); try{speechSynthesis.cancel();}catch(e){}
    audio.pause();
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    }catch(e){
      const n=e&&e.name;
      if(n==="NotAllowedError"||n==="SecurityError") showErr("Microphone access is blocked. iPhone: Settings → Safari (or the app you use) → Microphone → Allow. Android: tap the lock icon next to the address, then allow Microphone. Then try again.");
      else if(n==="NotFoundError") showErr("No microphone was found on this device.");
      else if(n==="NotReadableError") showErr("The microphone is busy in another app. Close calls or recorders and try again.");
      else showErr("The microphone isn't available here. Open the app from its website or home screen icon and try again.");
      return;
    }
    const chunks=[]; const mt=recMime();
    try{ mediaRec=mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream); }catch(e){ mediaRec=new MediaRecorder(stream); }
    const myRec=mediaRec;
    myRec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
    myRec.onstop=()=>{clearInterval(tick);clearTimeout(stopTO);stream&&stream.getTracks().forEach(t=>t.stop());
      if(!document.body.contains(btn)) return;
      if(!chunks.length){showErr("Nothing was recorded. Check that the microphone isn't muted and try again.");btn.innerHTML='<span class="dot"></span> Record yourself';stat.textContent="";return;}
      if(recUrl) try{URL.revokeObjectURL(recUrl);}catch(e){}
      recUrl=URL.createObjectURL(new Blob(chunks,{type:myRec.mimeType||mt||"audio/webm"}));
      audio.src=recUrl; audio.hidden=false; prow.hidden=false;
      btn.innerHTML='<span class="dot"></span> Record again';
      stat.textContent=`Recorded ${fmt(secs)}. Play it back: are the word endings crisp?`;};
    myRec.start(); markPractice(); secs=0;
    btn.innerHTML='<span class="dot live"></span> Stop recording'; stat.textContent="Recording… 0:00";
    tick=setInterval(()=>{secs++;stat.textContent="Recording… "+fmt(secs);},1000);
    stopTO=setTimeout(()=>{if(myRec.state==="recording")myRec.stop();},MAX*1000);
  };
  cleanup.push(()=>{clearInterval(tick);clearTimeout(stopTO);try{if(mediaRec&&mediaRec.state==="recording")mediaRec.stop();}catch(e){} if(stream)stream.getTracks().forEach(t=>t.stop()); try{audio.pause();}catch(e){}});
}

let naturalFailed=false, curClip=null, clipRaf=0;
const useNatural=()=>!naturalFailed&&(!state.voice||state.voice===NATURAL);
function stopClip(){cancelAnimationFrame(clipRaf);if(curClip){const c=curClip;curClip=null;c._tok=null;c.onended=c.onerror=c.onplaying=null;try{c.pause();}catch(e){}}}
const clipEl=new Audio(); clipEl.preload="auto"; try{clipEl.preservesPitch=true;clipEl.setAttribute("playsinline","");}catch(e){}
function playClip(name,container,rate,onStart,onDone,onFail){
  stopClip();
  const st=TIMING[name]||[], spans=container?[...container.querySelectorAll(".w")]:[];
  const a=clipEl; const token={}; curClip=a; a._tok=token;
  a.src="audio/"+name+".mp3"; a.defaultPlaybackRate=rate; a.playbackRate=rate;
  let done=false;
  const live=()=>a._tok===token;
  const clear=()=>spans.forEach(s=>s.classList.remove("on"));
  const tick=()=>{if(!live()||curClip!==a)return;const t=a.currentTime;let idx=-1;for(let j=0;j<st.length;j++){if(st[j]<=t)idx=j;else break;}
    spans.forEach((s,j)=>s.classList.toggle("on",j===idx));clipRaf=requestAnimationFrame(tick);};
  const fin=()=>{if(done||!live())return;done=true;cancelAnimationFrame(clipRaf);clear();curClip=null;onDone&&onDone();};
  const fail=()=>{if(done||!live())return;done=true;cancelAnimationFrame(clipRaf);clear();curClip=null;naturalFailed=true;onFail&&onFail();};
  a.onended=fin; a.onerror=fail;
  a.onplaying=()=>{if(live()) a.playbackRate=rate;};
  onStart&&onStart();
  const p=a.play(); if(p&&p.then) p.then(()=>{if(live())clipRaf=requestAnimationFrame(tick);}).catch(e=>{if(!live())return;if(e&&e.name==="NotAllowedError"){fin();}else if(e&&e.name==="AbortError"){}else fail();});
  else clipRaf=requestAnimationFrame(tick);
}

/* ---- teacher voice: female English voices first, natural/premium ones on top ---- */
const FEMALE=/(female|samantha|ava|allison|susan|serena|kate|martha|stephanie|moira|tessa|karen|fiona|victoria|zira|aria|jenny|sonia|libby|michelle|emma|ana\b|sara|joanna|salli|kendra|kimberly|amy|olivia|nicky|catherine|google us english|google uk english female)/i;
const MALE=/(male\b|daniel|alex\b|fred|tom\b|oliver|arthur|aaron|gordon|rishi|guy|ryan|davis|tony|christopher|eric|brian|matthew|google uk english male)/i;
function englishVoices(){let v=[];try{v=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));}catch(e){}
  const score=x=>(FEMALE.test(x.name)&&!/google uk english male/i.test(x.name)?100:0)-(MALE.test(x.name)&&!FEMALE.test(x.name)?100:0)
    +(/natural|premium|enhanced|neural|online/i.test(x.name)?20:0)+(/^en[-_]GB/i.test(x.lang)?8:/^en[-_]US/i.test(x.lang)?6:0)+(x.localService?2:0);
  return v.sort((a,b)=>score(b)-score(a));}
function voiceLabel(x){const accent=/GB/i.test(x.lang)?"British":/US/i.test(x.lang)?"American":/AU/i.test(x.lang)?"Australian":/IE/i.test(x.lang)?"Irish":x.lang;
  return x.name.replace(/^(Microsoft|Google)\s+/,"").replace(/\s*\(.*\)$/,"").replace(/\s+-\s+English.*$/,"")+" · "+accent;}

let actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();
  o.frequency.value=880;g.gain.setValueAtTime(.15,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.4);
  o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.4);}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}

const EXPRESS=[0,2,5]; // breath, lip trills, tongue twisters: about 2 minutes
let autoWarm=false;
function warmup(express){
  topbar(false); setTab("warmup");
  const steps=(express?EXPRESS:WARMUP.map((_,i)=>i)).map(i=>({...WARMUP[i],n:i+1}));
  const total=steps.reduce((a,w)=>a+w.secs,0);
  const full=WARMUP.reduce((a,w)=>a+w.secs,0), ex=EXPRESS.reduce((a,i)=>a+WARMUP[i].secs,0);
  app.innerHTML=`<section class="view">
    <div style="display:flex;flex-direction:column;gap:10px"><h1>${express?"Express warm-up":"Daily warm-up"}</h1>
    <p class="muted">${express?"Three quick exercises for just before a call, interview or presentation.":"The full routine. Do it before a lesson or an important day."}</p>
    <div class="seg" role="tablist" aria-label="Warm-up length">
      <button role="tab" aria-selected="${!!express}" data-w="warmup-express">Express · ${Math.round(ex/60)} min</button>
      <button role="tab" aria-selected="${!express}" data-w="warmup">Full · ${Math.round(full/60)} min</button>
    </div></div>
    <div class="card" id="wcard">
      <div class="steps" id="wsteps">${steps.map(()=>"<span></span>").join("")}</div>
      <div class="meta" id="wmeta"></div>
      <h2 id="wt"></h2><p id="wd" style="font-size:17px"></p>
      <div class="timer"><div class="clock" id="wclock"></div>
      <div class="row"><button class="btn primary" id="wgo">Start</button><button class="btn ghost small" id="wskip">Skip →</button><button class="btn ghost small" id="wsay" aria-label="Hear the instructions">🔊 Hear it</button></div></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px"><h3>The routine · about ${Math.max(1,Math.round(total/60))} min</h3>
    <div class="list">${steps.map((w,k)=>`<div class="item" style="cursor:default"><span class="n">${String(k+1).padStart(2,"0")}</span><span class="ti">${esc(w.t)}</span><span class="mi">${w.secs}s</span></div>`).join("")}</div></div>
  </section>`;
  app.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>go(b.dataset.w));
  let k=0,left=steps[0].secs,int=null;
  const show=()=>{const w=steps[k];$("#wt").textContent=w.t;$("#wd").textContent=w.d;$("#wclock").textContent=fmt(left);
    $("#wmeta").textContent=`STEP ${k+1} OF ${steps.length}`;
    document.querySelectorAll("#wsteps span").forEach((s,j)=>s.classList.toggle("on",j<=k));};
  const say=()=>{const w=steps[k];const tts=()=>{try{if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w.t+". "+w.d);u.lang="en-US";const v=englishVoices()[0];if(v)u.voice=v;u.rate=.95;speechSynthesis.speak(u);}catch(e){}};
    if(!naturalFailed) playClip("w"+w.n,null,1,null,null,tts); else tts();};
  const next=()=>{stopClip();if(k<steps.length-1){k++;left=steps[k].secs;show();if(int)say();}else{clearInterval(int);int=null;
    $("#wt").textContent="Warm-up done";$("#wd").textContent="Your voice is ready. Go and speak with confidence.";$("#wclock").textContent="0:00";$("#wgo").textContent="Go to lessons";$("#wgo").onclick=()=>go("home");}};
  const start=()=>{if(int){clearInterval(int);int=null;$("#wgo").textContent="Resume";return;}
    if(left===steps[k].secs) say(); markPractice();$("#wgo").textContent="Pause";
    int=setInterval(()=>{left--;if(left<=0){beep();next();}else $("#wclock").textContent=fmt(left);},1000);};
  $("#wgo").onclick=start; $("#wskip").onclick=next; $("#wsay").onclick=say;
  cleanup.push(()=>{clearInterval(int);stopClip();try{speechSynthesis.cancel();}catch(e){}}); show();
  if(autoWarm){autoWarm=false;start();}
}

    <div class="card kcardx"><h3>My turn</h3>
      <p class="prompt">${esc(K.turn)}</p>
      <div class="row"><button class="btn ghost small" id="kturnsay">🔊 Hear it</button></div>
      <div class="timer"><div class="clock" id="kclock">${fmt(K.secs)}</div>
        <div class="row"><button class="btn kbtn small" id="kgo">Start</button><button class="btn ghost small" id="kreset">Reset</button></div></div>
      ${recorderHTML()}
    </div>
    <div class="card kcardx kdone">
      ${state.kids[i]?`<div class="kwin">${starSVG(true)}<div><b>You earned: ${esc(K.badge)}</b><p class="tip">Super job! You can practise again any time.</p></div></div>`
        :`<p class="prompt">Did you try it?</p>`}
      <div class="row"><button class="btn ${state.kids[i]?"ghost":"kbtn"}" id="kstar">${state.kids[i]?"Take back the star":"I did it! Give me a star"}</button>
      ${i<KIDS.length-1?`<button class="btn ghost" id="knext">Next lesson →</button>`:""}</div>
    </div>
  </section>`;
  window.scrollTo(0,0);
  const lines=[...app.querySelectorAll(".kline")]; let playing=false, tmo=null;
  const setActive=j=>lines.forEach((x,n)=>x.classList.toggle("active",n===j));
  const ttsSay=(text,done)=>{try{if(!("speechSynthesis" in window)){done&&done();return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";const v=englishVoices()[0];if(v)u.voice=v;u.rate=.85;u.onend=u.onerror=()=>done&&done();speechSynthesis.speak(u);}catch(e){done&&done();}};
  const stopK=()=>{playing=false;clearTimeout(tmo);stopClip();try{speechSynthesis.cancel();}catch(e){}setActive(-1);$("#kall").textContent="▶ Play all";};
  const sayLine=(j,done)=>{setActive(j);
    if(!naturalFailed) playClip(`k${i+1}-${j+1}`,lines[j],1,null,()=>{setActive(-1);done&&done();},()=>ttsSay(K.say[j],()=>{setActive(-1);done&&done();}));
    else ttsSay(K.say[j],()=>{setActive(-1);done&&done();});};
  const clip=(name,text)=>{stopK(); if(!naturalFailed) playClip(name,null,1,null,null,()=>ttsSay(text)); else ttsSay(text);};
  lines.forEach((b,j)=>b.onclick=()=>{stopK();markPractice();sayLine(j);});
  $("#kall").onclick=()=>{if(playing){stopK();return;}stopK();playing=true;markPractice();$("#kall").textContent="■ Stop";let j=0;
    const next=()=>{if(!playing)return;if(j>=lines.length){stopK();return;}sayLine(j++,()=>{if(playing)tmo=setTimeout(next,1800);});};next();};
  $("#kintro").onclick=()=>clip(`ki${i+1}`,K.t+". "+K.why+" "+K.game.join(" "));
  $("#kturnsay").onclick=()=>clip(`kt${i+1}`,K.turn);
  cleanup.push(stopK);
  let left=K.secs,int=null;const ck=$("#kclock");
  const draw=()=>{ck.textContent=fmt(Math.max(0,left));};
  $("#kgo").onclick=()=>{if(int){clearInterval(int);int=null;$("#kgo").textContent="Go on";return;}
    stopK();markPractice();$("#kgo").textContent="Pause";
    int=setInterval(()=>{left--;draw();if(left<=0){clearInterval(int);int=null;beep();$("#kgo").textContent="Again";left=K.secs;}},1000);};
  $("#kreset").onclick=()=>{clearInterval(int);int=null;left=K.secs;draw();$("#kgo").textContent="Start";};
  cleanup.push(()=>clearInterval(int));
  bindRecorder();
  $("#kstar").onclick=()=>{state.kids[i]=!state.kids[i];if(state.kids[i])markPractice();save();kidLesson(i);if(state.kids[i])app.querySelector(".kdone").scrollIntoView({block:"center"});};
  if($("#knext")) $("#knext").onclick=()=>go("kids-"+(i+2));
}

/* ---- ABOUT ---- */
function about(){
  topbar(false); setTab("about");
  const A=AUTHOR;
  app.innerHTML=`<section class="view">
    <div class="author">
      <div class="avatar" aria-hidden="true">${esc(A.name.split(" ").map(x=>x[0]).join(""))}</div>
      <div style="min-width:0;display:flex;flex-direction:column;gap:4px">
        <h3>Made by</h3><h1 class="aname">${esc(A.name)}</h1><p class="muted">${esc(A.role)}</p>
      </div>
    </div>
    <p class="goal">${esc(A.bio)}</p>
    <div class="open">
      <div class="row"><span class="pill"><span class="pdot"></span>Open to work</span><span class="pill">Open to collaborations</span></div>
      <p>${esc(A.pitch)}</p>
      <div class="contact">
        ${A.email?`<span class="mail" id="mail">${esc(A.email)}</span><button class="btn ghost small" id="cmail">Copy email</button>`:""}
        ${A.linkedin?`<a class="btn ghost small" href="${esc(A.linkedin)}" target="_blank" rel="noopener">LinkedIn ↗</a>`:""}
      </div>
    </div>
    <div class="card"><h3>Send feedback</h3>
      <p class="tip">Found a bug, have an idea, or want a new lesson? I read every message.</p>
      <div class="fgrid">
        <label for="ftype" class="tip">Topic</label>
        <select id="ftype" class="vsel"><option>Idea or suggestion</option><option>Something isn't working</option><option>New lesson request</option><option>Collaboration or job offer</option><option>Other</option></select>
        <label for="fname" class="tip">Your name (optional)</label>
        <input id="fname" class="vsel" autocomplete="name">
        <label for="fmsg" class="tip">Message</label>
        <textarea id="fmsg" placeholder="What would make Spok better for you?"></textarea>
      </div>
      <div class="row"><button class="btn dark" id="fsend">Send by email</button><button class="btn ghost small" id="fcopy">Copy message</button></div>
      <p class="tip" id="fstat" aria-live="polite"></p>
    </div>
    <div class="card support"><h3>Support Spok</h3>
      <p>Spok is free, with no ads and no account. If it helped you before an interview or a big meeting, you can support my personal projects.</p>
      ${A.donate?`<div class="row"><a class="btn primary" href="${esc(A.donate)}" target="_blank" rel="noopener">${esc(A.donateLabel)} ↗</a></div>`
        :`<p class="tip">A donation link is coming soon. Until then, sharing Spok with a friend helps a lot.</p>`}
    </div>
    <p class="tip">Spok ${APP_VERSION} · Works offline once installed · Progress stays on your device · Voice generated with Kokoro (Apache 2.0)</p>
  </section>`;
  const msg=()=>{const t=$("#ftype").value,n=$("#fname").value.trim(),m=$("#fmsg").value.trim();return {t,n,m,body:`Topic: ${t}\n${n?"From: "+n+"\n":""}\n${m}\n\n— sent from Spok ${APP_VERSION}`};};
  const stat=t=>$("#fstat").textContent=t;
  const copy=async(text,ok)=>{try{await navigator.clipboard.writeText(text);stat(ok);}catch(e){stat("Copy didn't work here. Select the text and copy it manually.");}};
  if($("#cmail")) $("#cmail").onclick=()=>copy(A.email,"Email address copied.");
  $("#fsend").onclick=()=>{const x=msg(); if(!x.m){stat("Write a message first.");$("#fmsg").focus();return;}
    if(!A.email){copy(x.body,"Message copied.");return;}
    location.href=`mailto:${A.email}?subject=${encodeURIComponent("Spok feedback: "+x.t)}&body=${encodeURIComponent(x.body)}`;
    stat(`Your email app should open with the message ready. If it doesn't, tap "Copy message" and send it to ${A.email}.`);};
  $("#fcopy").onclick=()=>{const x=msg(); if(!x.m){stat("Write a message first.");return;} copy(x.body,`Message copied. Paste it into an email to ${A.email}.`);};
}

/* ---- router ---- */
function go(name){ if(location.hash!=="#"+name) location.hash=name; else route(); }
function route(){
  stopAll();
  const h=location.hash.slice(1);
  const m=h.match(/^lesson-(\d+)$/);
  if(m&&+m[1]>=1&&+m[1]<=LESSONS.length) lesson(+m[1]-1);
  else if(h==="warmup") warmup(false);
  else if(h==="warmup-express") warmup(true);
  else if(/^kids-\d+$/.test(h)&&+h.slice(5)>=1&&+h.slice(5)<=KIDS.length) kidLesson(+h.slice(5)-1);
  else if(h==="kids") kids();
  else if(h==="about") about();
  else home();
  window.scrollTo(0,0);
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>go(b.dataset.tab));
window.addEventListener("hashchange",route);
route();

if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js").catch(()=>{});}catch(e){}}
</script>
