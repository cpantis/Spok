<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrySpok</title>
<meta name="claude:viewport-fit-sides" content="cover">

<meta property="og:title" content="TrySpok: speak clearly, interview with confidence">
<meta property="og:description" content="29 short lessons for interviews and meetings, a natural voice guide, self-recording and lessons for kids. Free, no account.">
<meta property="og:url" content="https://tryspok.app/">
<meta property="og:image" content="https://tryspok.app/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="TrySpok app: Speak clearly. Interview with confidence.">

<meta name="twitter:image" content="https://tryspok.app/og-image.jpg">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Baloo+2:wght@600;700&display=swap">
<style>
/* Layout: single-column phone app — sticky top bar, stacked lesson rows, bottom tab bar. */
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --ink:#18202C; --muted:#535C6C; --line:#DCE1E8;
  --accent:#B34321; --accent-ink:#FFFFFF; --accent-soft:#FCE7DF; --good:#1B7950; --good-soft:#DDF2E8;
  --bar:#1B2230; --bar-ink:#F3F5F8; --hl:#FFE3A3;
  --m-voice:#B34321; --m-interview:#2B65C3; --m-meetings:#197557; --m-hard:#784DCC; --brand:#E2552A;
  --k-sky:#266BAB; --k-sun:#E8A317; --k-grape:#8A5CD1; --k-leaf:#2E9E5B; --k-berry:#D9466F;
  --kid:"Baloo 2", "Bricolage Grotesque", system-ui, sans-serif;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161F; --surface:#1A212D; --ink:#E8ECF2; --muted:#A3ACBC; --line:#2A3342;
  --accent:#F2683C; --accent-ink:#1A0D07; --accent-soft:#3A2219; --good:#4CC28B; --good-soft:#173329;
  --bar:#0B0F15; --bar-ink:#E8ECF2; --hl:#5A4415; --m-voice:#F2683C; --m-interview:#6A9BF0; --m-meetings:#3FBF8F; --m-hard:#A787F0; --k-sky:#3E8FDB; --k-sun:#E3A21F; --k-grape:#9468D8; --k-leaf:#2F9A5A; --k-berry:#D9507A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11161F; --surface:#1A212D; --ink:#E8ECF2; --muted:#A3ACBC; --line:#2A3342;
  --accent:#F2683C; --accent-ink:#1A0D07; --accent-soft:#3A2219; --good:#4CC28B; --good-soft:#173329;
  --bar:#0B0F15; --bar-ink:#E8ECF2; --hl:#5A4415; --m-voice:#F2683C; --m-interview:#6A9BF0; --m-meetings:#3FBF8F; --m-hard:#A787F0; --k-sky:#3E8FDB; --k-sun:#E3A21F; --k-grape:#9468D8; --k-leaf:#2F9A5A; --k-berry:#D9507A; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-ink)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.logo{display:flex;align-items:flex-end;gap:3px;height:22px}
.logo i{display:block;width:4px;border-radius:2px;background:var(--brand,var(--accent))}
.brand{font:700 20px/1 var(--display);letter-spacing:-.01em}
.top .back{background:none;border:0;color:var(--bar-ink);padding:6px 4px;font-weight:600;display:flex;gap:6px;align-items:center}
.top .spacer{flex:1}
.streak{font:500 12px var(--mono);opacity:.85}

main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
section.view{padding-block:20px;display:flex;flex-direction:column;gap:22px}

h1:focus{outline:none}
h1{font:800 clamp(28px,7vw,40px)/1.05 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font:700 20px/1.2 var(--display);margin:0;text-wrap:balance}
h3,.eyebrow{font:600 12px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
p{margin:0}
.muted{color:var(--muted)}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.ring{width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:700 22px/1 var(--display)}
.ring .num small{display:block;font:500 10px var(--mono);color:var(--muted);margin-top:4px}

.next{background:var(--bar);color:var(--bar-ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.next .eyebrow{color:#A9B3C3}
.next .t{font:700 22px/1.15 var(--display)}
.next .g{font-size:14px;color:#C9D1DD}
.next .mdot{background:color-mix(in srgb,var(--mc) 55%,#fff)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.small{padding:8px 12px;min-height:36px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* lesson list */
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item .n{font:500 13px var(--mono);color:var(--muted)}
.item .ti{font-weight:600;min-width:0}
.item .mi{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.item.done .n{color:var(--good)}
.item.done .ti{color:var(--muted)}
.chk{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--good);color:var(--surface);font-size:12px}

/* lesson view */
.meta{display:flex;gap:12px;font:500 12px var(--mono);color:var(--muted);flex-wrap:wrap}
.goal{font-size:17px;line-height:1.5;max-width:60ch}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.ideas{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.ideas li{display:grid;grid-template-columns:22px 1fr;gap:10px}
.ideas li b{font:700 15px var(--display);color:var(--accent)}
.lines{display:flex;flex-direction:column;gap:10px}
.line{font:600 18px/1.4 var(--display);padding:12px 14px;border-radius:12px;background:var(--bg);border:0;text-align:left;width:100%}
.line.active{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.line .w.on{background:var(--hl);border-radius:4px}
.cue{display:inline-flex;align-items:center;gap:5px;vertical-align:.12em;font:italic 500 13px/1 var(--body);letter-spacing:.02em;color:var(--accent);background:var(--surface);border:1.5px dashed color-mix(in srgb,var(--accent) 55%,transparent);border-radius:999px;padding:4px 10px 4px 9px;white-space:nowrap}
.cue svg{width:11px;height:11px;fill:currentColor}
.cue .w.on{background:none;text-decoration:underline;text-underline-offset:3px}
.cue:has(.w.on){background:var(--accent);color:var(--accent-ink);border-style:solid;border-color:var(--accent)}
.tip{font-size:13px;color:var(--muted)}
.speed{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.speed input{flex:1;min-width:140px;accent-color:var(--accent)}
.speed output{font:500 13px var(--mono);min-width:64px}
.vsel{flex:1;min-width:0;max-width:100%;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:14px var(--body)}

.timer{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.clock{font:700 44px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.clock.over{color:var(--accent)}
.tally{display:flex;align-items:center;gap:10px}
.tally .count{font:700 22px var(--mono);min-width:2ch;text-align:center}
.prompt{font:600 18px/1.4 var(--display)}
.rec{display:flex;flex-direction:column;gap:10px}
.rec audio{width:100%}
.note{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}
.checks input{width:20px;height:20px;accent-color:var(--good);margin-top:2px;flex:none}
.complete{background:var(--good-soft);color:var(--good);border-radius:12px;padding:12px 14px;font-weight:600}
.fb{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:12px;padding:12px 14px}
.fb h3{margin:0}
.fbrow{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start;font-size:14px;line-height:1.45}
.fbrow>span:first-child{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;font:700 12px var(--body);margin-top:1px}
.fbrow.good>span:first-child{background:var(--good-soft);color:var(--good)}
.fbrow.warn>span:first-child{background:var(--accent-soft);color:var(--accent)}
.cmp{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:14px}
.cmphead{display:flex;flex-direction:column;gap:2px}.cmphead b{font:700 16px var(--display)}
.cmpcur{font-weight:600;font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block}
.dot.live{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

/* tabbar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
/* each tab has its own colour: the icon sits in a tinted pill, filled when the tab is open */
nav.tabs button{--tc:var(--accent);background:none;border:0;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button[data-tab="home"]{--tc:var(--m-voice)}
nav.tabs button[data-tab="warmup"]{--tc:var(--m-meetings)}
nav.tabs button[data-tab="kids"]{--tc:color-mix(in srgb,var(--k-sun) 62%,#000)}
nav.tabs button[data-tab="about"]{--tc:var(--m-hard)}
nav.tabs .ico{display:grid;place-items:center;width:52px;height:30px;border-radius:999px;background:color-mix(in srgb,var(--tc) 15%,var(--surface));color:var(--tc);transition:background .15s,color .15s}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--tc);font-weight:700}
nav.tabs button[aria-current="page"] .ico{background:var(--tc);color:var(--surface)}
nav.tabs button[aria-current="page"] svg{stroke-width:2.4}
:root[data-theme="dark"] nav.tabs button[data-tab="kids"]{--tc:var(--k-sun)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs button[data-tab="kids"]{--tc:var(--k-sun)}}
textarea.mono{font:13px/1.4 var(--mono);min-height:90px;word-break:break-all}
textarea{width:100%;min-height:120px;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);color:var(--ink);font:16px/1.5 var(--body);resize:vertical}
/* hero */
.herotext{display:flex;flex-direction:column;gap:12px;min-width:0}
.hero h1 .hl{color:var(--m-interview)}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stats span{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.stats b{color:var(--ink);font-weight:700}
.ring .num small{letter-spacing:.06em}
.next .mdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mc);margin-right:8px;vertical-align:1px}

/* quick warm-up */
.quick{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.qicon{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--qc,var(--m-voice)) 14%,var(--surface));color:var(--qc,var(--m-voice))}
.prepfocus{font-size:15px;line-height:1.5;background:var(--surface);border:1px solid color-mix(in srgb,var(--mc) 30%,var(--line));border-radius:12px;padding:10px 12px;max-width:60ch}
.prepfocus b{color:var(--mc)}
.lrow .why{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:2px}
.lrow .ti.stack{display:block}
.qicon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.qtext{display:flex;flex-direction:column;gap:2px;min-width:0}
.qtext b{font:700 16px var(--display)}.qtext span{font-size:13px;color:var(--muted)}
.qbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:480px){.quick{grid-template-columns:44px 1fr}.qbtns{grid-column:1/-1;justify-content:stretch}.qbtns .btn{flex:1}}
.seg{display:inline-flex;align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
/* modules: collapsible cards, each in its own colour */
.modules{display:flex;flex-direction:column;gap:12px}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.mod.expanded{border-color:color-mix(in srgb,var(--mc) 45%,var(--line))}
.mtop{display:grid;grid-template-columns:44px 1fr 22px;gap:14px;align-items:start;width:100%;text-align:left;background:none;border:0;padding:16px}
.micon{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--mc) 15%,var(--surface));color:var(--mc)}
.micon svg,.mchip svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mtext{display:flex;flex-direction:column;gap:6px;min-width:0}
.mname{font:700 19px/1.2 var(--display)}
.mblurb{font-size:13px;color:var(--muted)}
.mbar{display:block;height:6px;border-radius:3px;background:color-mix(in srgb,var(--mc) 15%,var(--line));overflow:hidden;margin-top:4px}
.mbar i{display:block;height:100%;background:var(--mc);border-radius:3px;min-width:0}
.mmeta{font:500 12px var(--mono);color:var(--muted)}
.chev{width:22px;height:22px;margin-top:12px;fill:none;stroke:var(--muted);stroke-width:2;transition:transform .2s}
.mod.expanded .chev{transform:rotate(180deg)}
.mlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.lrow{grid-template-columns:30px 1fr auto;padding:12px 16px;gap:12px}
.lrow:last-child{border-bottom:0}
.lnum{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;font:600 13px var(--body);color:var(--mc);border:1.5px solid color-mix(in srgb,var(--mc) 40%,transparent)}
.lnum svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.lrow.done .lnum{background:var(--mc);color:var(--surface);border-color:var(--mc)}
.lrow.isnext{background:color-mix(in srgb,var(--mc) 9%,var(--surface))}
.lrow.isnext .lnum{background:var(--mc);color:var(--surface);border-color:var(--mc)}
.lrow .ti{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nextpill{font:700 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mc);border:1.5px solid var(--mc);border-radius:999px;padding:3px 7px}

/* lesson pages take their module colour */
.modtint{--accent:var(--mc);--accent-soft:color-mix(in srgb,var(--mc) 15%,var(--surface))}
.lhead{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:20px;background:color-mix(in srgb,var(--mc) 7%,var(--bg));border:1px solid color-mix(in srgb,var(--mc) 25%,transparent)}
.mchip{display:inline-flex;align-items:center;gap:6px;color:var(--mc);font-weight:600;text-transform:uppercase}
.mchip svg{width:15px;height:15px}
.modtint .card .eyebrow{color:var(--mc)}

/* kids */
.kidsv h1{font-family:var(--kid)}
.kidhero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.kidlead{font-size:18px;line-height:1.5;max-width:52ch}
.starbox{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.starbox b{font:700 26px/1 var(--kid)}.starbox small{font-size:14px;color:var(--muted)}
.star{width:26px;height:26px;fill:var(--line)}.star.on{fill:var(--k-sun)}
.kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kcard{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;border:0;border-radius:20px;padding:16px;min-height:132px;background:color-mix(in srgb,var(--kc) 22%,var(--surface));color:var(--ink)}
.kcard .knum{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--kc) 62%,#000);color:#fff;font:700 17px var(--kid)}
.kcard .kt{font:700 18px/1.2 var(--kid);min-width:0}
.kcard .kbadge{margin-top:auto;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.kcard .kbadge .star{width:16px;height:16px}
.kidtop{display:flex;flex-direction:column;gap:12px;background:color-mix(in srgb,var(--kc) 20%,var(--surface));border-radius:22px;padding:20px}
.kcardx{border-radius:20px}
.kcardx .eyebrow{color:color-mix(in srgb,var(--kc) 62%,#000)}
:root[data-theme="dark"] .kcardx .eyebrow{color:color-mix(in srgb,var(--kc) 70%,#fff)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kcardx .eyebrow{color:color-mix(in srgb,var(--kc) 70%,#fff)}}
.kgame{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:17px}
.kgame li::marker{font:700 17px var(--kid);color:var(--kc)}
.kline{font-family:var(--kid);font-size:20px}
.kline .spk{font-size:15px;margin-right:4px}
.kline.active{background:color-mix(in srgb,var(--kc) 22%,var(--surface));box-shadow:inset 3px 0 0 var(--kc)}
.btn.kbtn{background:color-mix(in srgb,var(--kc) 62%,#000);color:#fff}
.ksec{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.ksec h2{font-family:var(--kid);font-size:24px}
.kcard .ksym{width:auto;min-width:34px;padding:0 10px;border-radius:999px;font-size:16px}
.ptitle{display:flex;gap:14px;align-items:center}
.psym{flex:none;display:grid;place-items:center;min-width:64px;height:64px;padding:0 12px;border-radius:20px;background:color-mix(in srgb,var(--kc) 62%,#000);color:#fff;font:700 28px var(--kid)}
.poops{font-size:15px;background:color-mix(in srgb,var(--k-sun) 16%,var(--surface));border-radius:12px;padding:10px 12px;line-height:1.5}
.pwords{display:flex;flex-wrap:wrap;gap:10px}
.pword{border:1.5px solid color-mix(in srgb,var(--kc) 45%,var(--line));background:var(--surface);color:var(--ink);border-radius:14px;padding:10px 14px;font:700 20px var(--kid);min-height:48px}
.pword .spk{font-size:14px}
.pword.active{background:color-mix(in srgb,var(--kc) 22%,var(--surface));border-color:var(--kc)}
.silent{color:var(--muted);opacity:.55;text-decoration-thickness:2px}
.ppairs{display:flex;flex-direction:column;gap:10px}
.ppair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.ppair .pword{width:100%}
.pvs{font:700 20px var(--kid);color:var(--muted)}
.kwin{display:flex;gap:12px;align-items:center}.kwin .star{width:44px;height:44px;flex:none}
.kwin b{font:700 20px var(--kid)}

/* about */
.author{display:flex;gap:16px;align-items:center}
.avatar{flex:none;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:var(--bar);color:var(--brand,var(--accent));font:800 28px var(--display);letter-spacing:-.02em}
.aname{font-size:clamp(26px,6vw,34px)}
.open{display:flex;flex-direction:column;gap:12px;align-items:flex-start;background:var(--good-soft);border-radius:16px;padding:16px}
.open p{max-width:60ch}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--good);border:1.5px solid var(--good);border-radius:999px;padding:4px 10px;}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.contact{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mail{font:500 14px var(--mono);user-select:all;word-break:break-all}
a.btn{text-decoration:none;color:inherit}
a.btn.primary{color:var(--accent-ink)}
.fgrid{display:flex;flex-direction:column;gap:6px}
.fgrid input{font-size:16px}
.fgrid label{margin-top:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

<script>
const MODULES = [
 {id:"voice", name:"Voice foundations", blurb:"Breath, consonants, pace and tone. The base for everything else."},
 {id:"interview", name:"Interview ready", blurb:"From \"tell me about yourself\" to the final handshake."},
 {id:"meetings", name:"Speaking in meetings", blurb:"Get your turn, make your point, keep the room with you."},

const LESSONS = [
 /* ---------- Voice foundations ---------- */
 {mod:"voice",t:"Breath Before Words",m:10,goal:"Start every answer from a calm, low breath so your voice comes out steady instead of tight.",
  ideas:["Breathe in through the nose so your belly moves, not your shoulders.","Let the first word ride on the out-breath. Starting on empty lungs makes the voice thin.","One breath per sentence is a good rhythm for interviews."],
  drill:["[Breathe in.] (pause) Thank you for having me today.","[Breathe in.] (pause) Let me walk you through it.","[Breathe in.] (pause) That's a great question.","[Breathe in.] (pause) I'm really glad to be here.","[Breathe in.] (pause) I've spent five years helping teams deliver projects on time."],
  dtip:"Take a real breath at each pause. Notice how the first word comes out fuller.",
  prompt:"Say why you applied for your last job, one breath per sentence.",secs:30,
  checks:["My shoulders stayed down","Each sentence started on a fresh breath","My voice sounded steady, not tight"]},
 {mod:"voice",t:"Crisp Consonants",m:12,goal:"Finish your words. Clear consonants make you easier to follow, especially on calls and in a second language.",
  ideas:["Final consonants carry meaning: wanT, planneD, asK.","For T, D and N, touch the tip of your tongue to the ridge just behind your top teeth.","Lazy endings sound unsure. Crisp endings sound prepared."],
  drill:["Planned, checked, fixed and finished.","Big black bug bit a big black bear.","Red leather, yellow leather, red leather, yellow leather.","Good blood, bad blood, good blood, bad blood.","The project was planned, tested and delivered last week."],
  dtip:"Over-pronounce the last sound of every word. In real conversation, it settles to just the right amount.",
  prompt:"Describe a problem you solved, step by step.",secs:45,
  checks:["I could hear every word ending","T and D sounds were sharp","I didn't rush the last word"]},
 {mod:"voice",t:"Open Vowels Carry Further",m:10,goal:"Open your mouth wider so your voice reaches the whole room without strain.",
  ideas:["Volume comes from open vowels, not from pushing from your throat.","Drop the jaw a finger-width more than feels normal.","Aim your voice at the back wall, not at the nearest person."],
  drill:["Ah, Eh, Ee, Oh, Oo. Ah, Eh, Ee, Oh, Oo.","Unique New York, unique New York, you know you need unique New York.","Our goal is to open the new office by October.","How now, brown cow? How now, brown cow?","Hello, everyone, and thank you all for coming."],
  dtip:"Say each line at three volumes: to one person, to a table, to the back of a room.",
  prompt:"Present the main goal of a project you worked on, as if to a room of twenty people.",secs:30,
  checks:["My jaw was open and loose","My voice reached the back wall","My throat felt relaxed"]},
 {mod:"voice",t:"Pace and the Power Pause",m:12,goal:"Slow down to a pace people can follow, and use pauses to make key points land.",
  ideas:["Nervous speakers speed up. Aim for about 130 words a minute.","Pause before the important word, not after it.","A two-second pause feels long to you and normal to the listener."],
  drill:["The result was (pause) a forty percent drop in complaints.","What I learned (pause) was to ask for help earlier.","Six sleek swans swam swiftly southwards.","Our biggest risk (pause) is the deadline.","We finished (pause) two weeks early."],
  dtip:"Count \"one, two\" silently at each pause. Don't fill it.",
  prompt:"Share one result you're proud of. Pause before the number.",secs:30,
  checks:["My pace felt slower than usual","I paused before the key point","The pause didn't feel awkward on playback"]},
 {mod:"voice",t:"Silence Instead of Fillers",m:10,goal:"Replace \"um\", \"like\" and \"you know\" with clean pauses. Silence sounds like thinking; fillers sound like doubt.",
  ideas:["When an \"um\" is coming, close your lips. The pause replaces it.","Fillers appear most at the start of an answer, so begin with a breath instead.","Finish with a full stop rather than trailing off with \"so…\"."],
  drill:["One. (pause) Two. (pause) Three. (pause) Four.","Good question. (pause) Here's how I'd approach it.","Toy boat, toy boat, toy boat.","The answer is simple. (pause) We need more time.","That's all I have. (pause) Thank you."],
  dtip:"Use the filler counter during the speaking task and try to beat your score.",
  prompt:"Explain what you do at work to someone outside your field. No filler words.",secs:60,tally:true,
  checks:["I paused instead of filling","I started with a breath, not an \"um\"","Fewer fillers than last time"]},
 {mod:"voice",t:"A Steady, Trusted Tone",m:11,goal:"Speak near your natural pitch and end sentences going down, so you sound sure of what you say.",
  ideas:["Hum \"mm-hmm\" as if agreeing. That's close to your natural pitch.","Statements end on a falling pitch. A rising end turns facts into questions.","Short sentences sound more certain than long chains of \"and\"."],
  drill:["Mm-hmm. Mm-hmm. This is what I recommend.","Here's the plan. Here's why it works.","Lovely lemon liniment, lovely lemon liniment.","Mm-hmm. This is the right decision.","We launch in March. The team is ready."],
  dtip:"Keep the last word of each sentence at or below the pitch of the first word.",
  prompt:"Recommend a tool or method you trust and say why.",secs:45,
  checks:["I stayed near my natural pitch","My sentences ended on a falling pitch","I used short, complete sentences"]},

 /* ---------- Interview ready ---------- */
 {mod:"interview",t:"Tell Me About Yourself",m:15,goal:"Give a 60-second answer with a clear shape: present, past, and why this role.",
  ideas:["Present: who you are now and what you're good at.","Past: two highlights that prove it.","Future: why this role is the natural next step."],
  drill:["I'm a project coordinator with eight years of experience in logistics.","Most recently, I led a team of six through two major launches.","That's why this role is such a good fit for me.","I'm known for keeping complex projects calm and on track.","Now I'm ready for a bigger challenge, and this role offers exactly that."],
  dtip:"Smile slightly on the first line. Warmth is audible.",
  prompt:"Answer \"Tell me about yourself\" using present, past and future.",secs:60,
  checks:["My answer had three clear parts","I kept it to about 60 seconds","I ended on why this role"]},
 {mod:"interview",t:"Camera-Ready First Impressions",m:10,goal:"Look and sound confident in a video interview: eye line, light, and a clear first sentence.",
  ideas:["Look at the camera when you make a key point, not at their face on screen.","Raise the laptop to eye level and put the light in front of you.","Say your first sentence a little slower than normal; audio often lags."],
  drill:["Hi, I'm ____. Thanks for making the time.","Can you hear me clearly?","Great to meet you all.","Sorry, you cut out. Could you repeat the question?","Let me share my screen for a moment."],
  dtip:"Practise these looking straight into your phone's camera.",
  prompt:"Open a video interview: greet them, say your name, and thank them.",secs:20,
  checks:["I looked into the camera","My first sentence was unhurried","I sounded warm, not stiff"]},
 {mod:"interview",t:"Stories with STAR",m:15,goal:"Answer behavioural questions with Situation, Task, Action, Result, and keep the story tight.",
  ideas:["Situation and Task in two sentences. Most people spend too long here.","Action is the heart: say \"I\", not \"we\", for what you did.","End with a Result, ideally a number, and what you learned."],
  drill:["The event was two weeks away, and half the suppliers hadn't confirmed.","I called each supplier and solved the three biggest problems first.","We opened on time, and the client booked us again.","My task was to make sure every supplier was ready on time.","What I learned is to confirm the critical details first."],
  dtip:"Slow down slightly on the Result line. It's the part they'll remember.",
  prompt:"Tell me about a time you worked under a tight deadline. Use STAR.",secs:90,
  checks:["The setup took two sentences or fewer","I said \"I\" for my actions","I ended with a clear result"]},
 {mod:"interview",t:"Strengths Without Bragging",m:12,goal:"Name a strength and prove it with a short example, so it sounds like fact rather than boasting.",
  ideas:["Pick one strength that matters for this job.","Back it with a quick example: claim, proof, impact.","Let others' words help: \"My manager often said…\""],
  drill:["One of my strengths is finding problems early.","For example, I spotted a pricing error before the contract was signed.","My manager said it saved us from a very expensive mistake.","Colleagues often come to me when something needs a second check.","I'd bring the same attention to detail to this role."],
  dtip:"Say these in a calm, matter-of-fact tone, as if reading a report.",
  prompt:"What is your greatest strength? Give one example.",secs:45,
  checks:["I named one clear strength","I backed it with a real example","My tone was calm, not salesy"]},
 {mod:"interview",t:"The Weakness Question",m:12,goal:"Answer honestly with a real weakness and what you're doing about it.",
  ideas:["Choose a real weakness that isn't central to this job.","Spend most of the answer on how you're improving.","Skip clichés like \"I work too hard\"."],
  drill:["Earlier in my career, I said yes to too many requests.","Now I agree on priorities with my manager every Monday.","It's made my work much more predictable.","I still watch for it, but I'm much better at saying no.","It's taught me to protect time for the work that matters most."],
  dtip:"Keep the pitch level. A weakness said calmly sounds like self-awareness.",
  prompt:"What's one weakness you're working on?",secs:45,
  checks:["The weakness was real","Most of my answer was the fix","I stayed calm and level"]},
 {mod:"interview",t:"Gaps and Career Changes",m:12,goal:"Explain a gap or a change of direction briefly and positively, then move forward.",
  ideas:["Keep it short: one or two sentences of explanation.","Mention what you did or learned during that time.","Bridge straight to why you're ready now."],
  drill:["I took time off to care for a family member.","During that time, I completed a course in project management.","Now I'm fully ready and excited to get back to work.","That experience taught me to stay organised under pressure.","I'm keen to bring those skills to a team like yours."],
  dtip:"No apology in the voice. State it the way you'd state a date.",
  prompt:"Explain a gap or change in your career and bridge to this role.",secs:30,
  checks:["My explanation was brief","I mentioned something I learned","I ended looking forward"]},
 {mod:"interview",t:"Complex Ideas, Plain Words",m:13,goal:"Explain specialist work so that anyone can understand why it mattered.",
  ideas:["Start with the problem in everyday words.","Use one comparison people already know.","Finish with the result, not the jargon."],
  drill:["We needed customers to find answers without calling us.","Think of it like a good map: people find their own way.","It cut support calls in half within three months.","Before, every small question meant a phone call.","In short, customers got answers faster, and the team got time back."],
  dtip:"Say the comparison line slowly. It's what helps the listener picture it.",
  prompt:"Explain a complex project to someone from another department.",secs:60,
  checks:["I started with the problem","I used a comparison","I ended with the result"]},
 {mod:"interview",t:"When You Don't Know the Answer",m:10,goal:"Stay calm when a question stumps you: think out loud and show how you'd find the answer.",
  ideas:["Buy a moment honestly: \"Let me think about that.\"","Say what you do know, then how you'd find the rest.","Never bluff. Interviewers notice, and it costs trust."],
  drill:["Let me think about that for a second.","I haven't used that tool directly, but I've used something similar.","Here's how I'd find out.","That's a good question, and I want to give you a good answer.","Can I come back to that once I've thought it through?"],
  dtip:"Breathe before the first line. A calm pause looks like thinking, not panic.",
  prompt:"Answer a question you don't fully know, such as \"How would you plan a festival for ten thousand people?\"",secs:60,
  checks:["I paused calmly first","I shared what I do know","I explained how I'd find out"]},
 {mod:"interview",t:"Talking Salary Calmly",m:10,goal:"Discuss pay and start dates in a steady voice, with a researched range.",
  ideas:["Give a range based on research, with your target at the low end.","Say the number once, clearly, then stop talking.","Ask about the whole package, not only salary."],
  drill:["Based on my research, I'm looking for sixty to seventy thousand a year.","Could you tell me more about the full package?","I'm available to start in four weeks.","I'm flexible on the exact number for the right role.","Is there any flexibility in that range?"],
  dtip:"Don't let the pitch rise on the number. A rising pitch on the number invites a lower offer.",
  prompt:"The interviewer asks: \"What are your salary expectations?\"",secs:30,
  checks:["I said a clear range","I stopped after the number","My pitch stayed level"]},
 {mod:"interview",t:"Questions That Impress",m:10,goal:"Ask two or three thoughtful questions that show you're already thinking about the job.",
  ideas:["Ask about success: what does great look like after six months?","Ask about the team and how they work.","Avoid questions the website already answers."],
  drill:["What would success look like in the first six months?","How does the team decide what to work on first?","What's the biggest challenge the team is facing right now?","What do you enjoy most about working here?","How would you describe the way the team works together?"],
  dtip:"Lean in slightly and slow down a little. Questions asked slowly sound more genuine.",
  prompt:"Ask the interviewer three questions about the role.",secs:45,
  checks:["My questions were specific","I asked about success or challenges","I sounded curious, not scripted"]},
 {mod:"interview",t:"A Strong Close",m:10,goal:"End the interview by restating your fit, showing interest, and asking about next steps.",
  ideas:["Sum up your fit in one sentence.","Say plainly that you want the job.","Ask what happens next and when."],
  drill:["Thank you. I've really enjoyed this conversation.","From what I've heard, my experience is a strong match for this role.","What are the next steps?","I'd really like to be part of this team.","Is there anything else I can tell you about my experience?"],
  dtip:"Let \"What are the next steps?\" fall in pitch. It sounds confident rather than hopeful.",
  prompt:"Close the interview in under 30 seconds.",secs:30,
  checks:["I restated my fit","I showed real interest","I asked about next steps"]},

 /* ---------- Speaking in meetings ---------- */
 {mod:"meetings",t:"Small Talk Before It Starts",m:10,goal:"Use the first minutes before a meeting or interview to connect easily.",
  ideas:["Ask an open question: \"How's your week going?\"","Follow up on one detail they mention.","Share a small detail back so it's a conversation, not an interview."],
  drill:["How's your week going so far?","Oh really? How did that go?","I had a similar week, actually.","Did you do anything nice at the weekend?","That sounds great. Where did you go?"],
  dtip:"Raise your energy a little for the opener, then match theirs.",
  prompt:"Make small talk with a colleague while waiting for a meeting to start.",secs:45,
  checks:["I opened with a question","I followed up on a detail","I shared something back"]},
 {mod:"meetings",t:"Your First Words in the Room",m:10,goal:"Speak once in the first five minutes of every meeting. It gets much easier after that.",
  ideas:["Early speakers are seen as more engaged.","Your first words can be small: a question, an agreement, a fact.","Name the person you're building on."],
  drill:["Good morning, everyone.","I agree with Maria's point about the timeline.","Can I add one thing here?","I have a quick question about the budget.","Building on what Sam said, I think we should test it first."],
  dtip:"Say the first line louder than feels natural. Quiet openings get lost in meetings.",
  prompt:"Make your first contribution in a planning meeting.",secs:20,
  checks:["I spoke clearly and early","I named who I was building on","My voice was loud enough"]},
 {mod:"meetings",t:"The Two-Minute Update",m:12,goal:"Give a status update that is short and structured, and ends with what you need.",
  ideas:["Use Done, Next, Blocked.","Lead with the headline: on track or not.","End with a clear request if you have one."],
  drill:["Done: the new price list is ready for all three regions.","Next: we send it to customers on Friday.","Blocked: I need approval from finance.","Overall, we're on track for the launch.","If I get approval by Wednesday, we'll still meet the deadline."],
  dtip:"Pause after each label: Done, Next, Blocked. The structure becomes audible.",
  prompt:"Give your status update for this week using Done, Next, Blocked.",secs:120,
  checks:["I led with the headline","I used Done, Next, Blocked","I stated a clear request"]},
 {mod:"meetings",t:"Interrupting Politely",m:10,goal:"Break in when it matters, using a name, a bridge and a crisp first word.",
  ideas:["Use their name first. It gets attention without force.","Explain why you're interrupting in a few words.","Hand the floor back when you're done."],
  drill:["Alex, sorry to jump in. This affects the deadline.","Before we move on, there's one quick risk.","Thanks, back to you.","Sorry, can I add something before we decide?","Sam, can I come in here for a moment?"],
  dtip:"Make the first consonant crisp. A mumbled interruption is worse than none.",
  prompt:"Interrupt a colleague to flag a risk they've missed.",secs:20,
  checks:["I used their name","I said why I interrupted","I handed the floor back"]},
 {mod:"meetings",t:"Summarise and Check",m:11,goal:"Show you really listened by summarising in one sentence and checking you got it right.",
  ideas:["Summarise before you reply.","Check: \"Did I get that right?\"","Ask about what they emphasised, not what you want to talk about."],
  drill:["So what you're saying is that the timeline is the real problem.","Did I get that right?","Which part worries you most?","Let me check that I understood you correctly.","So the main priority is quality, not speed. Is that right?"],
  dtip:"Speak these a little slower than normal. A slower pace signals attention.",
  prompt:"Summarise what a colleague just told you, then ask one follow-up question.",secs:30,
  checks:["My summary was one sentence","I checked my understanding","My question followed their point"]},
 {mod:"meetings",t:"Disagree Without Drama",m:12,goal:"Disagree clearly and respectfully, keeping the focus on the problem, not the person.",
  ideas:["Acknowledge what's right in their view first.","State your concern with evidence.","Propose a way to decide, such as a trial run or a pilot."],
  drill:["I see why that approach is tempting.","My concern is that it skips the trial run.","Could we try it with one team first?","I see it differently, and here's why.","What if we test both options and compare the results?"],
  dtip:"Keep the pitch dropping at the end of each line. Rising pitch sounds defensive.",
  prompt:"Disagree with a plan to cut the project budget in half.",secs:45,
  checks:["I acknowledged their view","I gave evidence","I proposed a way forward"]},
 {mod:"meetings",t:"Numbers People Remember",m:12,goal:"Present results so the key number sticks: one number, one comparison, one meaning.",
  ideas:["Pick the one number that matters most.","Compare it to something: last quarter, the target, a known size.","Say what it means for the listener."],
  drill:["Complaints fell from sixty to twelve.","That's an eighty percent drop in one quarter.","It means happier customers and calmer weekends.","We saved forty hours a month.","That's like one extra person for a full week, every month."],
  dtip:"Pause before each number and stress it. Numbers vanish when rushed.",
  prompt:"Present one result from your work using number, comparison, meaning.",secs:45,
  checks:["I focused on one key number","I compared it to something","I said what it means"]},
 {mod:"meetings",t:"Running a Short Meeting",m:13,goal:"Open, steer and close a meeting so it ends on time with clear actions.",
  ideas:["Open with the goal and the time: \"In 20 minutes, we'll decide X.\"","Steer back politely when it drifts.","Close by reading out actions, owners and dates."],
  drill:["In twenty minutes, we'll decide on the launch date.","Let's park that and come back to it.","So, Ana owns the budget, due Thursday.","We have ten minutes left, so let's focus on the decision.","Thanks, everyone. The actions will be in the notes today."],
  dtip:"Use a slightly lower, slower voice when steering. It sounds in charge without being harsh.",
  prompt:"Open and close a 20-minute planning meeting.",secs:60,
  checks:["I stated goal and time","I steered back politely","I closed with owners and dates"]},
 {mod:"meetings",t:"Clear on Calls",m:10,goal:"Be easy to hear and follow on remote calls, where audio lag and noise work against you.",
  ideas:["Say who you are when you start speaking on big calls.","Slow down 10 percent. Compression blurs fast speech.","Stop clearly so others know you're done: \"That's it from me.\""],
  drill:["It's Ana here. One quick point.","Can everyone see my screen?","That's it from me. Any questions?","Sorry, go ahead. You first.","Let me repeat that, in case it cut out."],
  dtip:"Over-articulate the consonants. Microphones lose them first.",
  prompt:"Give a short update on a call with ten people.",secs:30,
  checks:["I said my name first","I spoke slightly slower","I ended with a clear stop"]},

 /* ---------- Hard conversations ---------- */
 {mod:"hard",t:"Feedback That Helps",m:15,goal:"Give tough feedback in a calm, direct voice with Situation, Behaviour, Impact.",
  ideas:["Situation: when and where.","Behaviour: what you saw, not what you assume.","Impact: what it caused, then ask for their view."],
  drill:["In Monday's meeting, you interrupted Dana three times.","The impact was that her proposal was never heard.","How did it look from your side?","I've noticed the reports have arrived late three weeks in a row.","What would help you get them in on time?"],
  dtip:"Say each line once with hedges like \"just\" or \"kind of\", then once clean. Hear the difference.",
  prompt:"Give feedback to a colleague who missed a deadline without warning.",secs:60,
  checks:["I used Situation, Behaviour, Impact","I left out hedging words","I asked for their view"]},
 {mod:"hard",t:"Saying No Kindly",m:10,goal:"Say no early, warmly and briefly, and offer an alternative where you can.",
  ideas:["Put the \"no\" in the first sentence.","Give one short reason, not a list of excuses.","Offer what you can do instead."],
  drill:["Thanks for thinking of me. I can't take this on right now.","I'm at full capacity until the end of the month.","What I can do is review it on Friday.","I'd love to help, but I can't commit to that this week.","If it can wait until next month, I'm happy to help then."],
  dtip:"Smile slightly as you say the first line. It warms the no.",
  prompt:"Decline a request to join an extra project, kindly and clearly.",secs:30,
  checks:["The no came early","I gave one short reason","I offered an alternative"]},
 {mod:"hard",t:"Calm Under Pushback",m:13,goal:"Stay steady when someone challenges you hard: lower, slower, and specific.",
  ideas:["When their volume goes up, bring yours down slightly.","Acknowledge the concern before answering it.","Move to facts and a next step."],
  drill:["I understand why that's frustrating.","Here's what the data shows.","Here's what I can do by tomorrow.","You're right that the delay caused problems.","Let's agree on the next step together."],
  dtip:"Read the lines more quietly than feels comfortable, with crisp consonants so quiet still sounds firm.",
  prompt:"A manager says your work is slowing the team down. Respond calmly.",secs:45,
  checks:["My voice stayed low and slow","I acknowledged the concern","I ended with a next step"]}
];

const WARMUP = [
 {t:"Breath",d:"Breathe in through your nose for 4 counts, then out for 6 on a soft \"sss\". Do it twice.",secs:20},
 {t:"Jaw & face",d:"Yawn widely, massage the jaw hinge, then chew a big piece of imaginary gum.",secs:30},

// Fill in anything missing or malformed, so old or hand-edited data can't break the app.
function normalizeState(s){const st={done:{},checks:{},fillers:{},days:[],kids:{},pron:{},prep:{},delivery:{}};
  if(s&&typeof s==="object"){for(const k of ["done","checks","fillers","kids","pron","prep","delivery"]) if(s[k]&&typeof s[k]==="object") st[k]=s[k];
    if(Array.isArray(s.days)) st.days=[...new Set(s.days.filter(d=>typeof d==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(d)))].sort();
    if(typeof s.voice==="string") st.voice=s.voice;}
  return st;}

function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

// Renders a line word by word. "(pause)" and [bracketed instructions] become cue chips, so they read as directions, not words to say.
const PAUSE_ICON='<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="2" width="2.4" height="8" rx="1"/><rect x="7.1" y="2" width="2.4" height="8" rx="1"/></svg>';
const words=s=>{let out="",inCue=false;
  s.split(/(\s+)/).forEach(p=>{
    if(!p) return;
    if(/^\s+$/.test(p)){out+=p;return;}
    if(p==="(pause)"){out+=`<span class="cue pause" title="Pause for two seconds">${PAUSE_ICON}<span class="w">pause</span></span>`;return;}
    let t=p,open=false,close=false;
    if(t.startsWith("[")){open=true;t=t.slice(1);}
    if(t.endsWith("]")){close=true;t=t.slice(0,-1);}
    if(open){out+='<span class="cue">';inCue=true;}
    out+=`<span class="w">${esc(t)}</span>`;
    if(close&&inCue){out+='</span>';inCue=false;}
  });
  if(inCue) out+='</span>';
  return out;};
let cleanup=[];
function stopAll(){cleanup.forEach(f=>{try{f()}catch(e){}});cleanup=[];awake.clear();}

/* Keep the screen on while a timer, the warm-up or a recording is running (where the browser allows it). */
const awake={who:new Set(),lock:null,
  set(key,on){on?this.who.add(key):this.who.delete(key);this.sync();},
  clear(){this.who.clear();this.sync();},
  async sync(){try{
    if(this.who.size&&!this.lock&&document.visibilityState==="visible"&&navigator.wakeLock){
      this.lock=await navigator.wakeLock.request("screen");this.lock.addEventListener("release",()=>{this.lock=null;});
      if(!this.who.size){const l=this.lock;this.lock=null;l.release();}}
    else if(!this.who.size&&this.lock){const l=this.lock;this.lock=null;await l.release();}
  }catch(e){this.lock=null;}}};
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")awake.sync();});

/* A stopwatch that counts real time, so it stays correct when the phone throttles or suspends the page.
   onSecond(n) runs once for every whole second passed (n = seconds since start, pauses excluded). */
function makeClock(onSecond){
  let base=0,t0=0,int=null,last=0;
  const elapsed=()=>base+(int?Date.now()-t0:0);
  // re-read the time on every step: onSecond may reset or restart this clock
  const tick=()=>{while(int){const n=Math.floor(elapsed()/1000);if(last>=n)break;last++;onSecond(last);}};
  return {get running(){return !!int;},
    start(){if(int)return;t0=Date.now();int=setInterval(tick,250);},
    pause(){if(!int)return;tick();base+=Date.now()-t0;clearInterval(int);int=null;},
    reset(){if(int){clearInterval(int);int=null;}base=0;last=0;}};
}
// Re-draw the current page in place (e.g. after marking it complete) without jumping back to the top.

  vsel.onchange=()=>{state.voice=vsel.value;naturalFailed=false;save();stopDrill();speakLine(0);};
  fillVoices();
  if(TTS){try{speechSynthesis.addEventListener("voiceschanged",fillVoices);cleanup.push(()=>speechSynthesis.removeEventListener("voiceschanged",fillVoices));}catch(e){}}
  function speakLine(li,onDone){
    if(useNatural()&&hasClip(`l${i+1}-${li+1}`)) return playClip(`l${i+1}-${li+1}`,lines[li],clipRate(),()=>{setActive(li)},onDone,()=>{if(TTS)speakTTS(li,onDone);else onDone&&onDone();});
    if(TTS) return speakTTS(li,onDone);
    onDone&&onDone();
  }
  function speakTTS(li,onDone){
    const text=L.drill[li], spans=[...lines[li].querySelectorAll(".w")], starts=[];
    text.replace(/\S+/g,(m,o)=>{starts.push(o);return m;});
    // same-length substitutions keep character positions aligned with the word highlights
    const u=new SpeechSynthesisUtterance(text.replace(/\[[^\]]*\]/g,m=>" ".repeat(m.length)).replace(/\(pause\)/g,"  ...  ").replace(/____/g,"name"));
    u.lang="en-US"; const v=pickVoice(); if(v) u.voice=v;
    u.rate=Math.min(1.4,Math.max(0.5,dw.value/150));
    u.onboundary=e=>{if(e.name&&e.name!=="word")return;let idx=0;starts.forEach((s,j)=>{if(s<=e.charIndex)idx=j;});spans.forEach((s,j)=>s.classList.toggle("on",j===idx));};
    let ended=false; u.onend=u.onerror=()=>{if(ended)return;ended=true;spans.forEach(s=>s.classList.remove("on"));onDone&&onDone();};
    setActive(li); try{speechSynthesis.resume();}catch(e){} speechSynthesis.speak(u);
  }
  function stopDrill(){playing=false;clearTimeout(dTimer);dTimer=null;stopClip();if(TTS){try{speechSynthesis.cancel();}catch(e){}}clearHL();$("#dplay").textContent="▶ Listen & read along";}
  const cmp=bindCompare(CMP_EN,L.drill.map((x,k)=>({name:`line ${k+1}`,show:`Line ${k+1}: ${x.replace(/\[|\]/g,"")}`,play:done=>speakLine(k,()=>{setActive(-1);done();}),
    clip:()=>useNatural()&&hasClip(`l${i+1}-${k+1}`)?`l${i+1}-${k+1}`:null,rate:()=>clipRate()})),stopDrill);
  lines.forEach((b,li)=>b.onclick=()=>{cmp.select(li);stopDrill();setActive(li);markPractice();speakLine(li);});
  $("#dplay").onclick=()=>{
    cmp.cancel();
    if(playing||dTimer){stopDrill();return;}
    markPractice(); $("#dplay").textContent="■ Stop";
    if(useNatural()||TTS){
      playing=true; if(TTS){try{speechSynthesis.cancel();}catch(e){}}
      let li=0;
      const next=()=>{if(!playing)return; if(li>=lines.length){stopDrill();setActive(-1);return;}

    }

    let k=0;
    const step=()=>{app.querySelectorAll(".line .w").forEach(w=>w.classList.remove("on"));
      if(k>=seq.length){stopDrill();lines.forEach(x=>x.classList.remove("active"));return;}
      const [li,w]=seq[k];lines.forEach((x,j)=>x.classList.toggle("active",j===li));w.classList.add("on");
      const pause=/[.,?!)]$/.test(w.textContent)?1.8:1; const gap=(k+1<seq.length&&seq[k+1][0]!==li)?2.2:1;

    step();
  };
  cleanup.push(stopDrill);

  // timer
  // counts down, then keeps counting the overtime (+0:05) so you can see how far over you went
  let left=L.secs, ran=false; const clock=$("#clock");
  const draw=()=>{clock.textContent=fmt(left);clock.classList.toggle("over",left<0);};
  const tclock=makeClock(n=>{left=L.secs-n;draw();if(left===0)beep();});
  $("#tgo").onclick=()=>{
    if(tclock.running){tclock.pause();awake.set("timer",false);$("#tgo").textContent="Resume";return;}
    primeAudio(); markPractice(); ran=true; $("#tgo").textContent="Pause"; tclock.start(); awake.set("timer",true);
  };
  let saveTally=()=>{};
  $("#treset").onclick=()=>{saveTally();tclock.reset();awake.set("timer",false);left=L.secs;ran=false;draw();$("#tgo").textContent=`Start ${L.secs}s timer`;};
  cleanup.push(()=>{tclock.reset();saveTally();});

  // filler tally: a round counts once the timer has run or a filler was tapped; the best (lowest) score is kept
  if(L.tally){let f=0;
    const show=()=>{const best=state.fillers[i];$("#fcount").textContent=f;$("#fbest").textContent=best!=null?`Best: ${best}`:"";};
    $("#fplus").onclick=()=>{f++;show();}; $("#fminus").onclick=()=>{f=Math.max(0,f-1);show();};
    saveTally=()=>{if(f>0||ran){const best=state.fillers[i];state.fillers[i]=best==null?f:Math.min(best,f);save();}f=0;ran=false;if(document.body.contains(clock))show();};
    show();}

  bindRecorder({target:L.secs,key:i});

  if(inPrep){bindPrepFooter(pk);return;}
  // checks & complete
  app.querySelectorAll(".checks input").forEach(c=>c.onchange=()=>{const a=state.checks[i]||[];a[+c.dataset.k]=c.checked;state.checks[i]=a;save();});
  $("#done").onclick=()=>{state.done[i]=!state.done[i]; if(state.done[i]) markPractice(); save(); rerender(()=>lesson(i));};
  $("#nextL").onclick=()=>go(i<LESSONS.length-1?"lesson-"+(i+2):"home");
}

function recorderHTML(fb){return `<div class="rec">

let mediaRec=null, stream=null, recUrl=null;
/* ---- microphone help, tailored to the phone ---- */
const UA=navigator.userAgent||"";
const IS_IOS=/iPad|iPhone|iPod/.test(UA)||(/Macintosh/.test(UA)&&navigator.maxTouchPoints>1);
const IS_ANDROID=/Android/i.test(UA);
const IN_APP=/FBAN|FBAV|FB_IAB|Instagram|Messenger|LinkedInApp|Snapchat|TikTok|Line\/|; wv\)/.test(UA);
const IN_FRAME=(()=>{try{return window.top!==window.self;}catch(e){return true;}})();
const STANDALONE=(()=>{try{return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;}catch(e){return false;}})();
function micHelp(kind){
  if(kind==="frame") return "The microphone is blocked in this preview. Open TrySpok from its own website (for example tryspok.app) to record yourself.";
  if(kind==="inapp") return IS_IOS
    ? "This app's built-in browser blocks the microphone. Tap ⋯ or the share icon and choose \"Open in Safari\", then try again."
    : "This app's built-in browser blocks the microphone. Tap ⋮ and choose \"Open in Chrome\", then try again.";
  if(kind==="denied") return IS_IOS
    ? (STANDALONE
      ? "Microphone access is off. Open Settings → Safari → Microphone and choose Ask or Allow. Then close TrySpok completely and open it again."
      : "Microphone access is off. In Safari, tap \"aA\" in the address bar → Website Settings → Microphone → Allow. Or open Settings → Safari → Microphone → Allow. Then reload the page.")
    : IS_ANDROID
      ? "Microphone access is off. Tap the icon to the left of the address → Permissions → Microphone → Allow. If that doesn't help, open Settings → Apps → Chrome → Permissions → Microphone → Allow. Then reload."
      : "Microphone access is off. Click the icon to the left of the address, allow the microphone, then reload the page.";
  if(kind==="busy") return "The microphone is busy in another app. End any call or voice recording, then try again.";
  if(kind==="none") return "No microphone was found on this device.";
  if(kind==="insecure") return "Recording needs a secure https address. Open TrySpok from its https website.";
  if(kind==="unsupported") return IS_IOS
    ? "This version of iOS can't record in the browser. Update iOS (14.5 or later), or use Voice Memos alongside the timer."
    : "This browser can't record audio. Use the latest Chrome, or your phone's voice recorder alongside the timer.";
  return "The microphone didn't start. Close other apps using it, reload TrySpok and try again.";
}
// Why recording can't start, or null if it can.
function micPrecheck(){
  if(!window.isSecureContext) return micHelp("insecure");
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder) return micHelp(IN_FRAME?"frame":IN_APP?"inapp":"unsupported");
  return null;}
// Turn a getUserMedia error into advice for this phone.
function micProblem(e){const n=e&&e.name;
  if(n==="NotAllowedError"||n==="SecurityError") return micHelp(IN_FRAME?"frame":IN_APP?"inapp":"denied");
  if(n==="NotFoundError"||n==="OverconstrainedError") return micHelp("none");
  if(n==="NotReadableError"||n==="AbortError") return micHelp("busy");
  if(n==="NotSupportedError") return micHelp(IN_FRAME?"frame":IN_APP?"inapp":"unsupported");
  return micHelp("other")+(n?" ("+n+")":"");}
const openMic=()=>navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
function makeRecorder(st){const mt=recMime();try{return mt?new MediaRecorder(st,{mimeType:mt}):new MediaRecorder(st);}catch(e){return new MediaRecorder(st);}}
function recMime(){if(!window.MediaRecorder||!MediaRecorder.isTypeSupported)return "";
  for(const t of ["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"]) if(MediaRecorder.isTypeSupported(t)) return t; return "";}
// fb: {target seconds, key} turns on delivery feedback after each recording (lessons)
function bindRecorder(fb){
  const btn=$("#rec"); if(!btn) return;
  const stat=$("#rstat"), audio=$("#play"), note=$("#rnote"), prow=$("#rplayrow");
  let tick=null, secs=0, stopTO=null, starting=false;
  const MAX=180;
  const showErr=t=>{note.hidden=false;note.textContent=t;};
  $("#rplay").onclick=()=>{stopClip();try{speechSynthesis.cancel();}catch(e){}
    if(audio.paused){audio.currentTime=0;audio.play().catch(()=>showErr("Playback didn't start. Use the player controls below."));}else audio.pause();};
  try{navigator.permissions&&navigator.permissions.query({name:"microphone"}).then(st=>{
    const upd=()=>{if(!document.body.contains(note))return; if(st.state==="denied"){showErr(micHelp("denied"));} else if(note.textContent===micHelp("denied")) note.hidden=true;};
    upd(); st.onchange=upd;}).catch(()=>{});}catch(e){}
  audio.onplay=()=>$("#rplay").textContent="❚❚ Pause";
  audio.onpause=audio.onended=()=>$("#rplay").textContent="▶ Play my recording";
  btn.onclick=async()=>{
    if(mediaRec&&mediaRec.state==="recording"){mediaRec.stop();return;}
    if(starting) return;
    note.hidden=true;
    if(cmpRec&&cmpRec.state==="recording"){showErr("Stop the other recording first.");return;}
    const pre=micPrecheck(); if(pre){showErr(pre);return;}
    stopClip(); try{speechSynthesis.cancel();}catch(e){}
    audio.pause();
    starting=true;
    try{ stream=await openMic(); }catch(e){ starting=false; showErr(micProblem(e)); return; }
    starting=false;
    // the page changed while the permission prompt was open: release the microphone
    if(!document.body.contains(btn)){stream.getTracks().forEach(t=>t.stop());return;}
    const chunks=[], mt=recMime();
    mediaRec=makeRecorder(stream);
    const myRec=mediaRec;
    myRec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
    myRec.onstop=()=>{clearInterval(tick);clearTimeout(stopTO);awake.set("rec",false);stream&&stream.getTracks().forEach(t=>t.stop());
      if(!document.body.contains(btn)) return;
      if(!chunks.length){showErr("Nothing was recorded. Check that the microphone isn't muted and try again.");btn.innerHTML='<span class="dot"></span> Record yourself';stat.textContent="";return;}
      if(recUrl) try{URL.revokeObjectURL(recUrl);}catch(e){}
      recUrl=URL.createObjectURL(new Blob(chunks,{type:myRec.mimeType||mt||"audio/webm"}));
      audio.src=recUrl; audio.hidden=false; prow.hidden=false;
      btn.innerHTML='<span class="dot"></span> Record again';
      stat.textContent=`Recorded ${fmt(secs)}. Play it back: are the word endings crisp?`;
      const box=$("#rfb");
      if(fb&&box){const blob=new Blob(chunks,{type:myRec.mimeType||mt||"audio/webm"}), prev=state.delivery[fb.key];
        box.hidden=false; box.innerHTML=`<h2 class="eyebrow">Your delivery</h2><p class="tip">Listening back…</p>`;
        blob.arrayBuffer().then(analyzeAudio).then(r=>{
          if(!document.body.contains(box)) return;
          box.innerHTML=`<h2 class="eyebrow">Your delivery</h2>`+deliveryHTML(r,fb.target,prev);
          if(!r.empty&&r.total>=6){state.delivery[fb.key]={wpm:Math.round(r.wpm/5)*5,range:+r.pitchRange.toFixed(1),day:today()};save();}
        }).catch(()=>{if(document.body.contains(box)) box.hidden=true;});
      }};
    myRec.start(); markPractice(); secs=0; awake.set("rec",true); if($("#rfb")) $("#rfb").hidden=true;
    btn.innerHTML='<span class="dot live"></span> Stop recording'; stat.textContent="Recording… 0:00";
    tick=setInterval(()=>{secs++;stat.textContent="Recording… "+fmt(secs);},1000);
    stopTO=setTimeout(()=>{if(myRec.state==="recording")myRec.stop();},MAX*1000);
  };
  cleanup.push(()=>{clearInterval(tick);clearTimeout(stopTO);try{if(mediaRec&&mediaRec.state==="recording")mediaRec.stop();}catch(e){} if(stream)stream.getTracks().forEach(t=>t.stop()); try{audio.pause();}catch(e){}});
}

function bindCompare(T,items,stopModel,first=0){
  const box=$("#cmp"), recB=$("#cmprec"), playB=$("#cmpplay"), stat=$("#cmpstat"), note=$("#cmpnote"), cur=$("#cmpcur");
  const fbEl=$("#cmpfb"), pace=new Map(); // per item: the pace sentence for the latest recording
  const urls=new Map(); let sel=first, rec=null, starting=false, playing=false, tok=0, tmo=null, tick=null, stopTO=null;
  const live=()=>document.body.contains(box);
  const ui=()=>{const has=urls.has(sel), it=items[sel];
    cur.textContent=it.show;
    recB.innerHTML=rec?`<span class="dot live"></span> ${T.stop}`:`<span class="dot"></span> ${esc(has?T.again(it.name):T.rec(it.name))}`;
    playB.hidden=!has||!!rec; playB.textContent=playing?T.stopPlay:T.play;
    const pc=!rec&&pace.get(sel); fbEl.hidden=!pc; if(pc){fbEl.className="fbrow "+(pc.ok?"good":"warn");fbEl.firstElementChild.textContent=pc.ok?"✓":"!";fbEl.lastElementChild.textContent=pc.text;}};

  const run=()=>{const url=urls.get(sel); if(!url) return;
    cancel(); stopModel(); const my=++tok; playing=true; ui(); stat.textContent=T.model;
    items[sel].play(()=>{if(my!==tok)return;
      tmo=setTimeout(()=>{if(my!==tok)return; stat.textContent=T.you;
        const end=()=>{if(my!==tok)return;playing=false;stat.textContent=T.done;ui();};
        meEl.onended=end; meEl.onerror=end; meEl.src=url;
        meEl.play().catch(()=>{if(my!==tok)return;playing=false;stat.textContent=T.tap;ui();});},400);});};
  playB.onclick=()=>{unlockMe(); if(playing){cancel();stopModel();return;} run();};
  recB.onclick=async()=>{
    unlockMe();
    if(rec){if(rec.state==="recording")rec.stop();return;}
    if(starting) return;
    note.hidden=true;
    if(mediaRec&&mediaRec.state==="recording"){note.hidden=false;note.textContent=T.busy;return;}
    const pre=micPrecheck(); if(pre){note.hidden=false;note.textContent=pre;return;}
    cancel(); stopModel(); starting=true;
    let st; try{st=await openMic();}catch(e){starting=false;note.hidden=false;note.textContent=micProblem(e);return;}
    starting=false;
    if(!live()){st.getTracks().forEach(t=>t.stop());return;}
    const idx=sel, chunks=[], r=makeRecorder(st); rec=r; cmpRec=r;
    r.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
    r.onstop=()=>{clearInterval(tick);clearTimeout(stopTO);awake.set("cmp",false);st.getTracks().forEach(t=>t.stop());rec=null;cmpRec=null;
      if(!live())return;
      if(!chunks.length){stat.textContent="";note.hidden=false;note.textContent=T.nothing;ui();return;}
      if(urls.has(idx)) URL.revokeObjectURL(urls.get(idx));
      const blob=new Blob(chunks,{type:r.mimeType||"audio/webm"});
      urls.set(idx,URL.createObjectURL(blob)); pace.delete(idx);
      // compare the length of your speech with the model's (at the speed it was played)
      const it=items[idx], clip=it.clip&&it.clip(), rate=it.rate?it.rate():1;
      if(clip) Promise.all([blob.arrayBuffer().then(analyzeAudio),modelDuration(clip)]).then(([u,m])=>{
        if(!live()||u.empty||!m) return;
        const md=m/rate, ratio=u.total/md, tol=md<1.2?.3:.15, us=secs1(u.total), ms=secs1(md);
        pace.set(idx,ratio<1-tol?{ok:false,text:T.fast(us,ms)}:ratio>1+tol?{ok:false,text:T.slow(us,ms)}:{ok:true,text:T.same(us,ms)});
        if(idx===sel) ui();
      }).catch(()=>{});
      if(idx===sel) run(); else {stat.textContent="";ui();}};
    r.start(); markPractice(); awake.set("cmp",true);
    let n=0; stat.textContent=T.recording+" 0:00";
    tick=setInterval(()=>{n++;stat.textContent=T.recording+" "+fmt(n);},1000);
    stopTO=setTimeout(()=>{if(r.state==="recording")r.stop();},30000);
    ui();};
  cleanup.push(()=>{cancel();if(rec&&rec.state==="recording")try{rec.stop();}catch(e){}urls.forEach(u=>URL.revokeObjectURL(u));});
  stat.textContent=""; ui();

}

// Feedback on a lesson's speaking task.
function deliveryHTML(r,target,prev){
  if(r.empty) return `<p class="fbrow warn"><span aria-hidden="true">!</span><span>No speech was heard. Check that the microphone isn't muted, then record again.</span></p>`;
  if(r.total<3||r.voicedSec<1.5) return `<p class="fbrow warn"><span aria-hidden="true">!</span><span>Record a few more seconds of speech to get feedback on your delivery.</span></p>`;
  const rows=[], row=(ok,label,t)=>rows.push(`<p class="fbrow ${ok?"good":"warn"}"><span aria-hidden="true">${ok?"✓":"!"}</span><span><b>${label}:</b> ${t}</span></p>`);
  const w=Math.round(r.wpm/5)*5, was=prev&&prev.wpm?` Last time: about ${prev.wpm}.`:"";
  if(r.total>=6){
    if(w<110) row(false,"Pace",`about ${w} words a minute. On the slow side: keep it moving between your key points.${was}`);
    else if(w<=155) row(true,"Pace",`about ${w} words a minute. A clear, easy pace for an interview.${was}`);
    else if(w<=170) row(false,"Pace",`about ${w} words a minute. A little quick: add a short pause after each key point.${was}`);
    else row(false,"Pace",`about ${w} words a minute. Fast: slow down and let your pauses do the work.${was}`);
  }
  const long=r.pauses.filter(p=>p>=3).length, perMin=r.pauses.length/r.total*60, longest=r.pauses.length?Math.max(...r.pauses):0;
  if(r.total>=8){
    if(long) row(false,"Pauses",`${long} silence${long>1?"s":""} over 3 seconds. Thinking pauses are fine, but keep them short.`);
    else if(perMin<2&&r.total>=15) row(false,"Pauses",`hardly any. Pause after each point so it lands.`);
    else row(true,"Pauses",`${r.pauses.length}, the longest ${secs1(longest)}. Pauses give your points weight.`);
  }
  if(r.voicedSec>=3){
    const pr=r.pitchRange;
    if(pr>=5) row(true,"Tone","lively and varied.");
    else if(pr>=3) row(true,"Tone","some variety. Lift your voice a little more on the key words.");
    else row(false,"Tone","quite flat. Lift your voice on the most important word of each sentence.");
  }
  if(target){const t=r.total;
    if(t<target*.5) row(false,"Length",`${fmt(Math.round(t))} for a ${fmt(target)} task. Add an example or a result.`);
    else if(t>target*1.25) row(false,"Length",`${fmt(Math.round(t))} for a ${fmt(target)} task. Cut to your main point.`);
    else row(true,"Length",`${fmt(Math.round(t))} for a ${fmt(target)} task. Well judged.`);
  }
  return rows.join("")+`<p class="tip">Measured on this phone; nothing is uploaded. Most accurate in a quiet room.</p>`;
}

  a.src="audio/"+name+".mp3"; a.defaultPlaybackRate=rate; a.playbackRate=rate;
  let done=false;
  const live=()=>a._tok===token;
  const clear=()=>spans.forEach(s=>s.classList.remove("on"));
  const tick=()=>{if(!live()||curClip!==a)return;const t=a.currentTime;let idx=-1;for(let j=0;j<st.length;j++){if(st[j]<=t)idx=j;else break;}
    spans.forEach((s,j)=>s.classList.toggle("on",j===idx));clipRaf=requestAnimationFrame(tick);};
  const fin=()=>{if(done||!live())return;done=true;cancelAnimationFrame(clipRaf);clear();curClip=null;onDone&&onDone();};
  const fail=()=>{if(done||!live())return;done=true;cancelAnimationFrame(clipRaf);clear();curClip=null;naturalFailed=true;onFail&&onFail();};
  a.onended=fin; a.onerror=fail;
  a.onplaying=()=>{if(live()) a.playbackRate=rate;};
  onStart&&onStart();
  const p=a.play(); if(p&&p.then) p.then(()=>{if(live())clipRaf=requestAnimationFrame(tick);}).catch(e=>{if(!live())return;if(e&&e.name==="NotAllowedError"){fin();}else if(e&&e.name==="AbortError"){}else fail();});
  else clipRaf=requestAnimationFrame(tick);
}

/* ---- teacher voice: female English voices first, natural/premium ones on top ---- */
const FEMALE=/(female|samantha|ava|allison|susan|serena|kate|martha|stephanie|moira|tessa|karen|fiona|victoria|zira|aria|jenny|sonia|libby|michelle|emma|ana\b|sara|joanna|salli|kendra|kimberly|amy|olivia|nicky|catherine|google us english|google uk english female)/i;
const MALE=/(male\b|daniel|alex\b|fred|tom\b|oliver|arthur|aaron|gordon|rishi|guy|ryan|davis|tony|christopher|eric|brian|matthew|google uk english male)/i;
function englishVoices(){let v=[];try{v=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));}catch(e){}
  const score=x=>(FEMALE.test(x.name)&&!/google uk english male/i.test(x.name)?100:0)-(MALE.test(x.name)&&!FEMALE.test(x.name)?100:0)
    +(/natural|premium|enhanced|neural|online/i.test(x.name)?20:0)+(/^en[-_]GB/i.test(x.lang)?8:/^en[-_]US/i.test(x.lang)?6:0)+(x.localService?2:0);
  return v.sort((a,b)=>score(b)-score(a));}
// Only three voices are offered: Heart (recorded) plus the best American and the best British voice on the device.
function mainVoices(){const all=englishVoices(), out=[], seen=new Set();
  const add=x=>{const l=voiceLabel(x);if(x&&!seen.has(l)&&out.length<2){seen.add(l);out.push(x);}};
  const us=all.find(x=>/^en[-_]US/i.test(x.lang)), gb=all.find(x=>/^en[-_]GB/i.test(x.lang));
  if(us)add(us); if(gb)add(gb); all.forEach(add);
  return out;}
function voiceLabel(x){const accent=/GB/i.test(x.lang)?"British":/US/i.test(x.lang)?"American":/AU/i.test(x.lang)?"Australian":/IE/i.test(x.lang)?"Irish":x.lang;
  return x.name.replace(/^(Microsoft|Google)\s+/,"").replace(/\s*\(.*\)$/,"").replace(/\s+-\s+English.*$/,"")+" · "+accent;}

let actx=null;
function primeAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();}catch(e){}}
function beep(){try{primeAudio();const o=actx.createOscillator(),g=actx.createGain();
  o.frequency.value=880;g.gain.setValueAtTime(.15,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.4);
  o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.4);}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}
